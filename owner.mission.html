<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Owner Panel</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head><body class="bg-[#fdf8ff] p-6 max-w-[480px] mx-auto">
<h1 class="text-[22px] font-bold">👑 Owner Panel</h1>
<p class="text-[12px] text-gray-500">Yaha se mission add karegi to sabko dikhega</p>
<div id="loginBox" class="mt-6"><input id="pin" type="password" placeholder="PIN: bora123" class="w-full border rounded-full px-4 py-3"><button onclick="login()" class="w-full mt-3 bg-black text-white py-3 rounded-full font-bold">Login</button></div>
<div id="panel" class="hidden">
<input id="t" placeholder="Title ex: Black Swan" class="w-full mt-6 border rounded-full px-4 py-3 text-[14px]">
<input id="l" placeholder="youtube.com/watch?v=..." class="w-full mt-3 border rounded-full px-4 py-3 text-[14px]">
<button onclick="add()" class="w-full mt-3 bg-[#7c3aed] text-white py-3 rounded-full font-bold">+ Add Mission for ALL</button>
<div id="list" class="mt-6 space-y-3"></div>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAdEoRnBLg4N7TEDE1WRU6FBjcrS6r7XNw",
  authDomain: "borahae-fm-f7075.firebaseapp.com",
  databaseURL: "https://borahae-fm-f7075-default-rtdb.firebaseio.com",
  projectId: "borahae-fm-f7075",
  storageBucket: "borahae-fm-f7075.firebasestorage.app",
  messagingSenderId: "319118277965",
  appId: "1:319118277965:web:eece2a5bf15708aab3cb04"
};
firebase.initializeApp(firebaseConfig); const db=firebase.database();
function login(){ if(document.getElementById('pin').value==='bora123'){ document.getElementById('loginBox').classList.add('hidden'); document.getElementById('panel').classList.remove('hidden'); load(); } else alert('Wrong PIN');}
function load(){ db.ref('missions').on('value', snap=>{ let ms=snap.val()||{}; let html=''; Object.entries(ms).forEach(([k,m])=>{ html+=`<div class="bg-white border p-3 rounded-xl flex justify-between items-center"><div><b class="text-[13px]">${m.title}</b><br><span class="text-[10px] text-gray-400">${m.id}</span></div><button onclick="del('${k}')" class="text-red-500 font-bold">✕</button></div>`; }); document.getElementById('list').innerHTML=html||'No missions'; });}
function add(){ let title=document.getElementById('t').value; let link=document.getElementById('l').value; let id=link.match(/(?:v=|\.be\/|shorts\/)([a-zA-Z0-9_-]{11})/)?.[1]||link; if(!title||!id) return alert('Title + link bhar'); db.ref('missions').push({title,desc:`Stream ${title} 12 times today`,id,goal:12}); document.getElementById('t').value=''; document.getElementById('l').value=''; }
function del(k){ if(confirm('Delete this mission for all users?')) db.ref('missions/'+k).remove(); }
</script></body></html>
