<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Missions - borahae.fm</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Manrope',sans-serif;background:#fdf8ff;overflow-x:hidden;}
.font-display{font-family:'Playfair Display',serif;}
.font-mono{font-family:'DM Mono',monospace;}
.sidebar-bg{background:#28164f;}
</style></head><body>

<header class="sticky top-0 z-30 bg-[#fdf8ff] border-b border-[#f3e8ff] px-4 py-3 flex items-center gap-3">
  <button onclick="openSidebar()" class="w-9 h-9 flex items-center justify-center text-[22px]">☰</button>
  <!-- SECRET: Is b pe 5 baar tap = owner login -->
  <div onclick="secretTap()" id="bLogo" class="w-[42px] h-[42px] bg-[#7c3aed] rounded-[14px] flex items-center justify-center text-white font-display text-[22px] font-bold">b</div>
</header>

<div id="ownerBar" class="hidden bg-[#28164f] text-white text-[12px] px-4 py-2 flex justify-between items-center">
  <span>👑 Owner Mode ON - Tu hi missions change kar sakti hai</span><button onclick="exitOwner()" class="bg-white/20 px-3 py-1 rounded-full">Exit</button>
</div>

<div id="sidebarOverlay" onclick="closeSidebar()" class="fixed inset-0 bg-black/50 hidden z-40"></div>
<aside id="sidebar" class="fixed top-0 left-0 w-[75%] max-w-[280px] h-full sidebar-bg z-50 -translate-x-full transition-transform duration-300 flex flex-col p-5">
  <div class="flex justify-between items-center"><div class="flex gap-2 items-center"><div class="w-8 h-8 bg-[#7c3aed] rounded-xl flex items-center justify-center text-white font-bold">b</div><span class="text-white font-bold">borahae.fm</span></div><button onclick="closeSidebar()" class="text-white text-xl">✕</button></div>
  <nav class="mt-10 space-y-1">
    <a href="home.html" class="flex gap-3 px-4 py-3 rounded-full text-white/60">⌂ Home</a>
    <a href="missions.html" class="flex gap-3 px-4 py-3 rounded-full bg-white/10 text-white">✦ Missions</a>
    <a href="music.html" class="flex gap-3 px-4 py-3 rounded-full text-white/60">▶ Videos</a>
    <a href="history.html" class="flex gap-3 px-4 py-3 rounded-full text-white/60">◫ My History</a>
    <a href="faq.html" class="flex gap-3 px-4 py-3 rounded-full text-white/60">? FAQ</a>
  </nav>
</aside>

<main class="max-w-[480px] mx-auto px-5 pt-6 pb-24">
  <p class="font-mono text-[12px] tracking-[2px] text-[#7c3aed]">STARTER MISSIONS / BANGTANTV</p>
  <h1 class="font-display text-[38px] font-bold leading-[1.1] mt-2">A little mission for<br>today.</h1>

  <!-- OWNER ONLY ADD BUTTON -->
  <div id="ownerControls" class="hidden mt-6">
    <button onclick="addMission()" class="w-full bg-[#7c3aed] text-white py-3 rounded-full font-bold">+ Add New Mission</button>
    <p class="text-[11px] text-gray-500 mt-2 text-center">Tu owner hai, yaha se daily missions change kar</p>
  </div>

  <div id="missionList" class="mt-8 space-y-4"></div>
</main>

<nav class="fixed bottom-0 left-0 w-full bg-[#111] flex justify-around items-center py-3">
  <a href="home.html" class="text-white/60 text-[22px]">⌂</a>
  <div class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center text-white text-[22px]">+</div>
  <a class="text-white/60 text-[18px] relative">▢<span class="absolute -top-2 -right-2 bg-white text-black text-[10px] w-4 h-4 rounded-full flex items-center justify-center">28</span></a>
</nav>

<script>
const OWNER_PIN = "bora123"; // <-- apna PIN yaha change kar sakti hai
let taps=0;
function secretTap(){
  taps++;
  if(taps>=5){
    let pin=prompt("Owner PIN daal 💜");
    if(pin===OWNER_PIN){ localStorage.setItem('isOwner','true'); showOwner(); alert("Owner Mode ON!"); }
    else alert("Wrong PIN");
    taps=0;
  }
  setTimeout(()=>taps=0,3000);
}
function showOwner(){
  if(localStorage.getItem('isOwner')==='true'){
    document.getElementById('ownerBar').classList.remove('hidden');
    document.getElementById('ownerBar').classList.add('flex');
    document.getElementById('ownerControls').classList.remove('hidden');
    render(true);
  }
}
function exitOwner(){ localStorage.removeItem('isOwner'); location.reload(); }

let missions = JSON.parse(localStorage.getItem('daily_missions') || '[{"title":"Dynamite","desc":"Stream Dynamite 12 times today","id":"gdZLi9oWNZg","goal":12,"progress":0},{"title":"Butter","desc":"Stream Butter 12 times today","id":"WMweEpGlu_U","goal":12,"progress":0}]');

function render(isOwner=false){
  const list=document.getElementById('missionList');
  list.innerHTML='';
  missions.forEach((m,i)=>{
    list.innerHTML+=`<div class="bg-white border rounded-[20px] p-4 flex gap-4 items-center shadow-sm">
      <img src="https://img.youtube.com/vi/${m.id}/mqdefault.jpg" class="w-[70px] h-[70px] rounded-[16px] object-cover">
      <div class="flex-1"><p class="font-bold text-[15px]">${m.title}</p><p class="text-[13px] text-gray-500">${m.desc}</p><p class="text-[12px] mt-1 text-gray-400">${m.progress} / ${m.goal} streams</p><div class="w-full h-1 bg-gray-100 rounded-full mt-1"><div class="h-1 bg-[#7c3aed] rounded-full" style="width:${(m.progress/m.goal)*100}%"></div></div></div>
      <div class="text-[#7c3aed] font-bold text-[13px]">0%</div>
      ${isOwner?`<button onclick="deleteMission(${i})" class="text-red-400 text-[18px] ml-2">✕</button>`:''}
    </div>`;
  });
}

function addMission(){
  let title=prompt("Mission Title? Ex: Black Swan");
  if(!title) return;
  let yt=prompt("YouTube link paste kar");
  let id=yt?.match(/(?:v=|\.be\/)([a-zA-Z0-9_-]{11})/)?.[1] || prompt("Video ID daal (11 letters)");
  if(!id) return;
  missions.push({title, desc:`Stream ${title} 12 times today`, id, goal:12, progress:0});
  localStorage.setItem('daily_missions', JSON.stringify(missions));
  render(true);
}
function deleteMission(i){
  if(confirm("Delete this mission?")){ missions.splice(i,1); localStorage.setItem('daily_missions', JSON.stringify(missions)); render(true); }
}
function openSidebar(){document.getElementById('sidebar').classList.remove('-translate-x-full');document.getElementById('sidebarOverlay').classList.remove('hidden');}
function closeSidebar(){document.getElementById('sidebar').classList.add('-translate-x-full');document.getElementById('sidebarOverlay').classList.add('hidden');}

showOwner();
render(localStorage.getItem('isOwner')==='true');
</script></body></html>
