<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owner Panel</title>
<style>
body{font-family:system-ui;background:#fdf2ff;padding:16px;margin:0}
.top{font-size:22px;font-weight:bold}
.card{background:#fff;padding:14px;border-radius:16px;margin-top:12px;box-shadow:0 2px 10px #0001;display:flex;justify-content:space-between;align-items:center}
input{width:100%;padding:13px;margin:6px 0;border-radius:25px;border:1px solid #ddd;box-sizing:border-box;font-size:15px}
.addBtn{width:100%;padding:14px;border-radius:25px;border:none;background:#7c3aed;color:#fff;font-weight:bold;font-size:16px;margin-top:8px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.saveBtn{background:#000;color:#fff;border:none;padding:8px 12px;border-radius:20px;font-size:13px}
.delBtn{color:red;font-size:26px;cursor:pointer;padding:0 8px}
</style>
</head>
<body>
<div class="top">👑 Owner Panel</div>
<p style="color:#666;margin-top:4px;font-size:13px">Yaha se stream target set karegi to sabko dikhega</p>

<input id="title" placeholder="Title ex: Black Swan">
<input id="link" placeholder="youtube.com/watch?v=...">
<input id="reqStreams" type="number" placeholder="Kitne streams karne hai? ex: 20">

<button class="addBtn" onclick="addMission()">+ Add Mission for ALL</button>

<div id="list"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
if(prompt("Enter Owner PIN:")!=="bora123"){document.body.innerHTML="<h1>Access Denied</h1>";throw "no"}

const firebaseConfig = {
  apiKey: "AIzaSyAdEOrnBLg4N7TEDE1WRU6FBjerS6r7Xnw",
  authDomain: "borahae-fm-f7075.firebaseapp.com",
  databaseURL: "https://borahae-fm-f7075-default-rtdb.firebaseio.com",
  projectId: "borahae-fm-f7075",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// NAYA FIXED FUNCTION - HAR LINK SE SAHI ID NIKALEGA
function getYouTubeID(urlOrId){
  if(!urlOrId) return "";
  urlOrId = urlOrId.trim();
  if(urlOrId.length===11 &&!urlOrId.includes("/") &&!urlOrId.includes("?") &&!urlOrId.includes("=")) return urlOrId;
  let reg = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/;
  let m = urlOrId.match(reg);
  if(m && m[2].length===11) return m[2];
  // fallback - last 11 chars if nothing else
  return urlOrId.slice(-11);
}

function addMission(){
  const t=title.value.trim(), l=link.value.trim(), s=parseInt(reqStreams.value)||12;
  if(!t||!l) return alert("Title + Link daal");
  let vid = getYouTubeID(l);
  if(!vid || vid.length!==11) return alert("Link sahi nahi hai! Sahi YouTube link daal");
  db.ref("missions/"+Date.now()).set({title:t, videoId:vid, id:vid, requiredStreams:s, createdAt:Date.now()});
  title.value=""; link.value=""; reqStreams.value="";
  alert("Added "+t+" with "+s+" streams ✅ ID: "+vid);
}

db.ref("missions").on("value", snap=>{
  list.innerHTML="";
  const data=snap.val(); if(!data) return;
  Object.entries(data).reverse().forEach(([key,v])=>{
    const cleanId = getYouTubeID(v.videoId || v.id || "");
    const d=document.createElement("div"); d.className="card";
    d.innerHTML=`
      <div style="flex:1">
        <b>${v.title}</b><br><small>${cleanId}</small><br>
        <div class="row">
          <input id="inp_${key}" type="number" value="${v.requiredStreams||12}" style="width:80px;padding:8px;border-radius:12px">
          <span style="font-size:13px">streams</span>
          <button class="saveBtn" onclick="updateStreams('${key}')">Update</button>
        </div>
      </div>
      <div class="delBtn" onclick="del('${key}')">×</div>
    `;
    list.appendChild(d);
  });
});

function updateStreams(key){
  const newVal = parseInt(document.getElementById("inp_"+key).value);
  if(!newVal) return alert("Number daal");
  db.ref("missions/"+key+"/requiredStreams").set(newVal);
  alert("Updated to "+newVal+" streams ✅");
}
function del(k){ if(confirm("Delete?")) db.ref("missions/"+k).remove(); }
</script>
</body>
</html>
