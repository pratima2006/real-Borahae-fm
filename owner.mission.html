<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owner Panel</title>
<style>
body{font-family:system-ui;background:#fdf2ff;padding:15px}
.card{background:#fff;padding:12px;border-radius:12px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px #0001}
.tag{padding:2px 8px;border-radius:20px;font-size:12px;color:#fff}
.high{background:#ff3b30}.med{background:#ff9500}.low{background:#34c759}
input,select{width:100%;padding:12px;margin:6px 0;border-radius:25px;border:1px solid #ddd;box-sizing:border-box}
button{width:100%;padding:13px;border-radius:25px;border:none;background:#7c3aed;color:#fff;font-weight:bold;font-size:16px}
</style>
</head>
<body>
<h2>👑 Owner Panel</h2>
<p style="color:#666">Priority set kar aur streams track kar</p>

<input id="title" placeholder="Title ex: Black Swan">
<input id="link" placeholder="youtube.com/watch?v=...">
<select id="priority">
  <option value="high">🔥 HIGH Priority - Zyada Stream Karwana hai</option>
  <option value="medium">⭐ MEDIUM Priority</option>
  <option value="low">💜 LOW Priority</option>
</select>
<button onclick="add()">+ Add Mission for ALL</button>

<div id="list"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
// ==== APNA PIN YAHAN CHANGE KAR LE ====
const MY_PIN = "bora123";
if(prompt("Enter Owner PIN:")!== MY_PIN){ document.body.innerHTML="<h1>Access Denied</h1>"; throw "no"; }

const firebaseConfig = {
  apiKey: "AIzaSyA4y6u-HU-tOQq1Rc2F1o0Zs0QqZzZqZzQ",
  authDomain: "borahae-fm-f7075.firebaseapp.com",
  databaseURL: "https://borahae-fm-f7075-default-rtdb.firebaseio.com",
  projectId: "borahae-fm-f7075",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function add(){
  const t=title.value.trim(); const l=link.value.trim(); const p=priority.value;
  if(!t||!l) return alert("Title + Link daal");
  const id = l.split("v=")[1]?.split("&")[0] || l.slice(-11);
  db.ref("missions/"+Date.now()).set({title:t, videoId:id, priority:p, totalStreams:0, createdAt:Date.now()});
  title.value=""; link.value="";
}
db.ref("missions").on("value", snap=>{
  list.innerHTML="";
  const data=snap.val(); if(!data) return;
  Object.entries(data).sort((a,b)=>b[0]-a[0]).forEach(([k,v])=>{
    const d=document.createElement("div"); d.className="card";
    d.innerHTML=`<div><b>${v.title}</b><br><small>${v.videoId}</small><br><small>🔁 Streams: ${v.totalStreams||0}</small><br><span class="tag ${v.priority=='high'?'high':v.priority=='medium'?'med':'low'}">${v.priority}</span></div><span onclick="del('${k}')" style="color:red;font-size:24px;cursor:pointer">×</span>`;
    list.appendChild(d);
  });
});
function del(k){ if(confirm("Delete?")) db.ref("missions/"+k).remove(); }
</script>
</body>
</html>
