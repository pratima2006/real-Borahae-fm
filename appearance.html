<div class="appearance-fragment">
<!-- GLASS TOAST - HOME.JS STYLE -->
<div id="toastBox" class="fixed top-[14px] left-1/2 -translate-x-1/2 z-[90] pointer-events-none flex flex-col items-center gap-2 w-[90%] max-w-[360px]"></div>

<p class="font-mono text-[9px] tracking-[3px] text-[#7c3aed] font-bold">APPEARANCE</p>
<h2 class="font-display text-[24px] font-bold mt-1 leading-[0.95]">Make it yours, ARMY.</h2>
<p class="text-[10px] text-[#8a7ca3] mt-1">Your face, your banner, your story — all in one place 💜</p>

<div class="mt-4 bg-white/80 backdrop-blur-[18px] border border-[#f3e8ff] rounded-[24px] p-[14px] shadow-[0_12px_40px_rgba(124,58,237,0.08),inset_0_1px_0_rgba(255,255,255,0.8)]">

<!-- PFP -->
<div>
<div class="flex items-center justify-between">
<p class="font-mono text-[9px] tracking-[2.5px] text-[#1a1033] font-bold">YOUR FACE • PFP</p>
<span class="text-[8px] bg-[#f5f3ff] border border-[#ede9fe] px-2 py-0.5 rounded-full font-bold">300x300</span>
</div>
<div class="mt-3 flex items-center gap-3 bg-[#fdf8ff] border border-[#f3e8ff] rounded-[16px] p-3">
<img id="pfpPreview" class="w-[64px] h-[64px] rounded-full object-cover border-[3px] border-white shadow-sm bg-[#f5f3ff] hidden">
<div id="pfpPlaceholder" class="w-[64px] h-[64px] rounded-full bg-[#ede9fe] border-[3px] border-white flex items-center justify-center text-[24px] text-[#7c3aed] shadow-sm">👤</div>
<div class="flex-1 min-w-0">
<p class="text-[11px] font-bold truncate" id="pfpNameLabel">ARMY</p>
<p class="text-[9px] text-[#9ca3af] mt-0.5">Tap ✎ to crop • Change = gallery</p>
</div>
</div>
<div class="grid grid-cols-4 gap-2 mt-3">
<button onclick="openEditPopup('pfp')" class="h-[38px] bg-[#7c3aed] rounded-[12px] flex items-center justify-center text-white text-[13px] font-bold shadow-[0_6px_18px_rgba(124,58,237,0.3)] active:scale-95 transition">✎</button>
<button onclick="deletePfp()" class="h-[38px] bg-white border border-[#fecdd3] rounded-[12px] flex items-center justify-center text-[#e11d48] text-[13px] active:scale-95 transition">🗑</button>
<button onclick="savePfp()" class="h-[38px] bg-[#7c3aed] rounded-[12px] flex items-center justify-center text-white text-[10px] font-bold active:scale-95 transition">Save</button>
<label for="pfpFile" class="h-[38px] bg-white border border-[#ede9fe] rounded-[12px] flex items-center justify-center text-[10px] font-bold text-[#1a1033] cursor-pointer active:scale-95 transition">Change</label>
</div>
</div>

<div class="h-[1px] bg-gradient-to-r from-transparent via-[#f3e8ff] to-transparent my-5"></div>

<!-- DISPLAY NAME -->
<div>
<p class="font-mono text-[9px] tracking-[2.5px] text-[#1a1033] font-bold">DISPLAY NAME</p>
<input id="displayNameInput" placeholder="Your ARMY name" class="w-full mt-2 bg-[#fdf8ff] border border-[#f3e8ff] rounded-[14px] px-3.5 py-3 text-[11px] font-semibold outline-none focus:border-[#7c3aed] focus:bg-white transition">
<button onclick="saveName()" class="w-full mt-2.5 bg-[#1a1033] text-white rounded-full py-3 text-[11px] font-bold active:scale-[0.98] shadow-sm">Save name</button>
</div>

<div class="h-[1px] bg-gradient-to-r from-transparent via-[#f3e8ff] to-transparent my-5"></div>

<!-- BANNER -->
<div>
<div class="flex items-center justify-between">
<p class="font-mono text-[9px] tracking-[2.5px] text-[#1a1033] font-bold">BANNER • TOP</p>
<span class="text-[8px] bg-[#f5f3ff] border border-[#ede9fe] px-2 py-0.5 rounded-full font-bold">600x250</span>
</div>
<div class="mt-3 relative h-[116px] bg-[#f5f3ff] rounded-[16px] overflow-hidden border border-[#f3e8ff]">
<img id="bannerPreview" class="w-full h-full object-cover hidden">
<div id="bannerPlaceholder" class="w-full h-full flex items-center justify-center text-[10px] text-[#7c3aed] font-bold tracking-wide">No banner yet</div>
</div>
<div class="grid grid-cols-4 gap-2 mt-3">
<button onclick="openEditPopup('banner')" class="h-[38px] bg-[#7c3aed] rounded-[12px] flex items-center justify-center text-white text-[13px] active:scale-95 transition">✎</button>
<button onclick="deleteBanner()" class="h-[38px] bg-white border border-[#fecdd3] rounded-[12px] flex items-center justify-center text-[#e11d48] text-[13px] active:scale-95 transition">🗑</button>
<button onclick="saveBanner()" class="h-[38px] bg-[#7c3aed] rounded-[12px] flex items-center justify-center text-white text-[10px] font-bold active:scale-95 transition">Save</button>
<label for="bannerFile" class="h-[38px] bg-white border border-[#ede9fe] rounded-[12px] flex items-center justify-center text-[10px] font-bold cursor-pointer active:scale-95 transition">Change</label>
</div>
</div>

<div class="h-[1px] bg-gradient-to-r from-transparent via-[#f3e8ff] to-transparent my-5"></div>

<!-- BIO -->
<div>
<p class="font-mono text-[9px] tracking-[2.5px] text-[#1a1033] font-bold">BIO • ABOUT YOU</p>
<textarea id="bioInput" placeholder="Write something purple... e.g. OT7 forever 💜" class="w-full mt-2 bg-[#fdf8ff] border border-[#f3e8ff] rounded-[14px] px-3.5 py-3 text-[11px] outline-none focus:border-[#7c3aed] focus:bg-white min-h-[74px] resize-none"></textarea>
<div class="flex gap-2 mt-2.5">
<button onclick="saveBio()" class="flex-1 bg-[#7c3aed] text-white rounded-full py-3 text-[11px] font-bold active:scale-[0.98] shadow-[0_6px_18px_rgba(124,58,237,0.25)]">Save bio</button>
<button onclick="deleteBio()" class="w-[90px] bg-white border border-[#f3e8ff] rounded-full py-3 text-[11px] font-bold text-[#6b7280] active:scale-95">Clear</button>
</div>
</div>

</div>
</div>

<!-- REAL FILE INPUTS - NOT HIDDEN, OFFSCREEN SO GALLERY OPENS IN APK -->
<input type="file" id="pfpFile" accept="image/*" style="position:absolute; left:-9999px; width:1px; height:1px; opacity:0;">
<input type="file" id="bannerFile" accept="image/*" style="position:absolute; left:-9999px; width:1px; height:1px; opacity:0;">

<!-- CROP MODAL -->
<div id="cropModal" class="fixed inset-0 bg-black/50 backdrop-blur-[8px] hidden items-center justify-center z-[80] p-4" onclick="if(event.target===this)closeCrop()">
<div class="bg-white/90 backdrop-blur-[20px] border border-white rounded-[22px] w-full max-w-[340px] overflow-hidden shadow-[0_24px_70px_rgba(0,0,0,0.25)] animate-[pop_0.28s_ease]">
<div class="p-4 border-b border-[#f3e8ff] flex justify-between items-center">
<p id="cropTitle" class="font-bold text-[12px]">Crop PFP</p>
<button onclick="closeCrop()" class="w-7 h-7 bg-[#f3f4f6] rounded-full text-[11px]">✕</button>
</div>
<div class="p-5 bg-[#fdf8ff]/80 flex flex-col items-center">
<div id="cropBox" class="relative overflow-hidden bg-[#ede9fe] border-[2.5px] border-[#7c3aed] shadow-[0_8px_30px_rgba(124,58,237,0.2)]" style="width:200px;height:200px;border-radius:50%">
<img id="cropImg" class="w-full h-full object-cover">
</div>
<p class="text-[10px] text-[#9ca3af] mt-3">Auto center crop • Perfect square</p>
</div>
<div class="p-3 grid grid-cols-2 gap-2 bg-white/80 backdrop-blur">
<button onclick="closeCrop()" class="bg-[#f3f4f6] py-3 rounded-full font-bold text-[11px]">Cancel</button>
<button onclick="confirmCrop()" class="bg-[#7c3aed] text-white py-3 rounded-full font-bold text-[11px] shadow-[0_6px_18px_rgba(124,58,237,0.3)]">Crop & Save 💜</button>
</div>
</div>
</div>

<style>
@keyframes pop{from{transform:translateY(14px) scale(0.96);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
@keyframes toastIn{from{transform:translateY(-18px) scale(0.96);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
@keyframes toastOut{from{transform:translateY(0) scale(1);opacity:1}to{transform:translateY(-12px) scale(0.96);opacity:0}}
.toast-item{animation:toastIn 0.32s cubic-bezier(0.34,1.56,0.64,1) forwards; backdrop-filter:blur(18px) saturate(180%); -webkit-backdrop-filter:blur(18px) saturate(180%); background:rgba(255,255,255,0.88); border:1px solid rgba(233,213,255,0.7); box-shadow:0 12px 40px rgba(124,58,237,0.15), inset 0 1px 0 rgba(255,255,255,0.8);}
.toast-out{animation:toastOut 0.35s ease forwards;}
.glow-icon{filter:drop-shadow(0 0 8px rgba(124,58,237,0.6));}
</style>

<script>
(function(){
let tempPfp=null, tempBanner=null, cropType=null;
const canvas=document.createElement('canvas');

function getUser(){ try{return JSON.parse(localStorage.getItem('borahaeUser')||'{}')}catch(e){return {}} }

window.showToast=(msg)=>{
  let box=document.getElementById('toastBox');
  let div=document.createElement('div');
  div.className='toast-item pointer-events-auto flex items-center gap-2.5 px-4 py-2.5 rounded-full text-[11px] font-bold text-[#1a1033] w-fit max-w-[92%]';
  div.innerHTML=`<span class="w-7 h-7 rounded-full bg-[#f5f3ff] border border-[#ede9fe] flex items-center justify-center text-[12px] glow-icon">✨</span><span class="leading-tight">${msg}</span>`;
  box.appendChild(div);
  setTimeout(()=>{ div.classList.add('toast-out'); setTimeout(()=>div.remove(), 360); }, 2500);
};

window.loadAppearance=()=>{
  let u=getUser();
  let name=u.name||localStorage.getItem('army_name')||'ARMY';
  let photo=u.photo||localStorage.getItem('army_pfp')||'';
  let banner=localStorage.getItem('borahae_banner')||u.banner||'';
  let bio=localStorage.getItem('borahae_bio')||u.bio||'';
  document.getElementById('displayNameInput').value=name;
  document.getElementById('pfpNameLabel').innerText=name;
  document.getElementById('bioInput').value=bio;
  if(photo){ let p=document.getElementById('pfpPreview'); p.src=photo; p.classList.remove('hidden'); document.getElementById('pfpPlaceholder').classList.add('hidden'); tempPfp=photo; }
  if(banner){ let b=document.getElementById('bannerPreview'); b.src=banner; b.classList.remove('hidden'); document.getElementById('bannerPlaceholder').classList.add('hidden'); tempBanner=banner; }
};

document.getElementById('pfpFile').addEventListener('change',e=>{
  let f=e.target.files[0]; if(!f) return;
  let r=new FileReader(); r.onload=()=>openEditPopup('pfp', r.result); r.readAsDataURL(f); e.target.value='';
});
document.getElementById('bannerFile').addEventListener('change',e=>{
  let f=e.target.files[0]; if(!f) return;
  let r=new FileReader(); r.onload=()=>openEditPopup('banner', r.result); r.readAsDataURL(f); e.target.value='';
});

window.openEditPopup=(type, src=null)=>{
  cropType=type;
  if(!src){
    if(type==='pfp') src=tempPfp || document.getElementById('pfpPreview').src || '';
    else src=tempBanner || document.getElementById('bannerPreview').src || '';
    if(!src) return type==='pfp'? document.getElementById('pfpFile').click() : document.getElementById('bannerFile').click();
  }
  document.getElementById('cropTitle').innerText= type==='banner'? 'Crop Banner • 600x250' : 'Crop PFP • 300x300';
  document.getElementById('cropImg').src=src;
  let box=document.getElementById('cropBox');
  if(type==='banner'){ box.style.width='260px'; box.style.height='110px'; box.style.borderRadius='14px'; }
  else { box.style.width='200px'; box.style.height='200px'; box.style.borderRadius='50%'; }
  let m=document.getElementById('cropModal'); m.classList.remove('hidden'); m.classList.add('flex');
};
window.closeCrop=()=>{ let m=document.getElementById('cropModal'); m.classList.add('hidden'); m.classList.remove('flex'); };
window.confirmCrop=()=>{
  let img=document.getElementById('cropImg');
  let size = cropType==='banner'? {w:600,h:250} : {w:300,h:300};
  canvas.width=size.w; canvas.height=size.h;
  let ctx=canvas.getContext('2d');
  let iw=img.naturalWidth, ih=img.naturalHeight;
  let sW=iw*0.85, sH= cropType==='banner'? ih*0.55 : iw*0.85;
  let sx=(iw-sW)/2, sy=(ih-sH)/2;
  ctx.drawImage(img, sx, sy, sW, sH, 0,0,size.w,size.h);
  let data=canvas.toDataURL('image/jpeg',0.85);
  if(cropType==='banner'){
    tempBanner=data;
    document.getElementById('bannerPreview').src=data; document.getElementById('bannerPreview').classList.remove('hidden');
    document.getElementById('bannerPlaceholder').classList.add('hidden');
    showToast('Banner cropped • Save to keep');
  } else {
    tempPfp=data;
    document.getElementById('pfpPreview').src=data; document.getElementById('pfpPreview').classList.remove('hidden');
    document.getElementById('pfpPlaceholder').classList.add('hidden');
    showToast('PFP cropped • Save to keep');
  }
  closeCrop();
};

window.savePfp=()=>{
  if(!tempPfp) return showToast('First choose a photo');
  localStorage.setItem('army_pfp', tempPfp);
  let u=getUser(); u.photo=tempPfp; localStorage.setItem('borahaeUser', JSON.stringify(u));
  if(window.db && firebase.auth().currentUser) db.ref('users/'+firebase.auth().currentUser.uid).update({photo:tempPfp});
  try{ sidebarAvatarImg.src=tempPfp; sidebarAvatarImg.classList.remove('hidden'); sidebarAvatarLetter.classList.add('hidden'); }catch(e){}
  showToast('PFP changed successfully');
};
window.deletePfp=()=>{
  if(!tempPfp && document.getElementById('pfpPreview').classList.contains('hidden')) return showToast('Already default PFP');
  tempPfp=null;
  localStorage.removeItem('army_pfp');
  let u=getUser(); delete u.photo; localStorage.setItem('borahaeUser', JSON.stringify(u));
  document.getElementById('pfpPreview').classList.add('hidden'); document.getElementById('pfpPreview').src='';
  document.getElementById('pfpPlaceholder').classList.remove('hidden');
  if(window.db && firebase.auth().currentUser) db.ref('users/'+firebase.auth().currentUser.uid).update({photo:null});
  showToast('PFP deleted successfully');
};
window.saveBanner=()=>{
  if(!tempBanner) return showToast('First choose a banner');
  localStorage.setItem('borahae_banner', tempBanner);
  let u=getUser(); u.banner=tempBanner; localStorage.setItem('borahaeUser', JSON.stringify(u));
  if(window.db && firebase.auth().currentUser) db.ref('users/'+firebase.auth().currentUser.uid).update({banner:tempBanner});
  showToast('Banner changed successfully');
};
window.deleteBanner=()=>{
  if(!tempBanner && document.getElementById('bannerPreview').classList.contains('hidden')) return showToast('Already no banner');
  tempBanner=null;
  localStorage.removeItem('borahae_banner');
  let u=getUser(); delete u.banner; localStorage.setItem('borahaeUser', JSON.stringify(u));
  document.getElementById('bannerPreview').classList.add('hidden'); document.getElementById('bannerPreview').src='';
  document.getElementById('bannerPlaceholder').classList.remove('hidden');
  if(window.db && firebase.auth().currentUser) db.ref('users/'+firebase.auth().currentUser.uid).update({banner:null});
  showToast('Banner deleted successfully');
};
window.saveName=()=>{
  let n=document.getElementById('displayNameInput').value.trim();
  if(!n) return showToast('Enter a name first');
  localStorage.setItem('army_name', n);
  let u=getUser(); u.name=n; localStorage.setItem('borahaeUser', JSON.stringify(u));
  document.getElementById('pfpNameLabel').innerText=n;
  try{ sidebarName.innerText=n; }catch(e){}
  if(window.db && firebase.auth().currentUser) db.ref('users/'+firebase.auth().currentUser.uid).update({name:n});
  showToast('Display name changed successfully');
};
window.saveBio=()=>{
  let b=document.getElementById('bioInput').value.trim();
  if(!b){
    localStorage.removeItem('borahae_bio');
    let u=getUser(); delete u.bio; localStorage.setItem('borahaeUser', JSON.stringify(u));
    if(window.db && firebase.auth().currentUser) db.ref('users/'+firebase.auth().currentUser.uid).update({bio:null});
    showToast('Bio deleted successfully');
    return;
  }
  localStorage.setItem('borahae_bio', b);
  let u=getUser(); u.bio=b; localStorage.setItem('borahaeUser', JSON.stringify(u));
  if(window.db && firebase.auth().currentUser) db.ref('users/'+firebase.auth().currentUser.uid).update({bio:b});
  showToast('Bio changed successfully');
};
window.deleteBio=()=>{ document.getElementById('bioInput').value=''; saveBio(); };

loadAppearance();
})();
</script>
