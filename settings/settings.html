<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Settings - borahae.fm</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Manrope:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Manrope',sans-serif;background:#fdf8ff;overflow-x:hidden;}
.font-display{font-family:'Playfair Display',serif;}
.font-mono{font-family:'DM Mono',monospace;}
.sidebar-bg{background:#28164f;}
.paper-grid{background-image:linear-gradient(#e9d5ff1f 1px, transparent 1px),linear-gradient(90deg, #e9d5ff1f 1px, transparent 1px);background-size:22px 22px;}
.glass-header{position:sticky;top:0;z-index:30;backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);background:rgba(253,248,255,0.72);border-bottom:1px solid rgba(233,213,255,0.6);}
.box-premium{background:#fff;border:1px solid #f3e8ff;border-radius:14px;padding:11px 12px;display:flex;align-items:center;justify-content:space-between;transition:.15s}
.box-premium:active{transform:scale(0.98)}
.icon-circle{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#f5f3ff;overflow:hidden}
.icon-circle img{width:18px;height:18px;filter:invert(31%) sepia(84%) saturate(2476%) hue-rotate(250deg) brightness(94%) contrast(92%);}
@keyframes pop{0%{transform:scale(0.94);opacity:0}100%{transform:scale(1);opacity:1}}.animate-pop{animation:pop.22s cubic-bezier(.16,1,.3,1)}
.modal-bg{backdrop-filter:blur(6px);background:rgba(0,0,0,0.25)}
</style></head><body class="paper-grid pb-24">
<header class="glass-header px-4 py-3 flex items-center gap-3">
<button onclick="openSidebar()" class="w-9 h-9 bg-white/80 backdrop-blur border border-[#ede9fe] rounded-[10px] flex items-center justify-center text-[18px] shadow-sm">☰</button>
<div class="w-[36px] h-[36px] bg-[#7c3aed] rounded-[12px] flex items-center justify-center text-white font-display text-[20px] font-bold">b</div>
<p class="font-mono text-[9px] tracking-[2.5px] text-[#7c3aed] font-bold">SETTINGS</p>
</header>
<div id="sidebarOverlay" onclick="closeSidebar()" class="fixed inset-0 bg-black/40 hidden z-40"></div>
<aside id="sidebar" class="fixed top-0 left-0 w-[280px] h-full sidebar-bg z-50 -translate-x-full transition-all duration-300 flex flex-col p-5">
<div class="flex items-center justify-between"><div class="flex items-center gap-3"><div class="w-[34px] h-[34px] bg-[#7c3aed] rounded-[12px] flex items-center justify-center text-white font-display text-[20px]">b</div><span class="text-white font-bold">borahae<span class="text-[#a78bfa]">.fm</span></span></div><button onclick="closeSidebar()" class="text-white/60">✕</button></div>
<p class="font-mono text-[9px] tracking-[2.5px] text-white/40 mt-7 mb-2">YOUR SCRAPBOOK</p>
<nav class="space-y-[2px]">
<a href="home.html" class="flex items-center gap-3 px-3 py-2.5 rounded-full text-white/60 text-[13px]">⌂ Home</a>
<a href="plaza.html" class="flex items-center gap-3 px-3 py-2.5 rounded-full text-white/60 text-[13px]">☾ Plaza</a>
<a href="missions.html" class="flex items-center gap-3 px-3 py-2.5 rounded-full text-white/60 text-[13px]">✦ Missions</a>
</nav>
<div class="mt-auto border-t border-white/10 pt-4">
<a href="settings.html" class="flex items-center gap-3 px-3 py-2.5 rounded-full bg-white/10 text-white font-semibold text-[13px]">⚙ Settings</a>
<div id="sidebarUserBox" onclick="location.href='profile.html'" class="mt-4 bg-white/10 rounded-[14px] p-2.5 flex items-center gap-3 cursor-pointer"><div id="sidebarAvatar" class="w-9 h-9 bg-[#f472b6] rounded-full flex items-center justify-center font-bold text-[#28164f] text-[13px] overflow-hidden"><img id="sidebarAvatarImg" class="w-full h-full object-cover hidden"/><span id="sidebarAvatarLetter">A</span></div><div class="overflow-hidden"><p id="sidebarName" class="text-white text-[12px] font-bold truncate">ARMY</p><p class="text-white/50 text-[10px] truncate">View profile</p></div></div>
</div>
</aside>

<main class="w-full max-w-[480px] mx-auto px-4 pt-5 pb-28">
<div id="settingsMain">
<p class="font-mono text-[9px] tracking-[3px] text-[#7c3aed] font-bold">SETTINGS</p>
<h1 class="font-display text-[26px] leading-[0.95] font-bold mt-1">Keep your page yours.</h1>
<div class="mt-5 space-y-[9px]">
<button onclick="openPage('appearance')" class="box-premium w-full"><div class="flex items-center gap-3"><div class="icon-circle"><img src="icons/appearance-purple.png" onerror="this.outerHTML='◍'"></div><div class="text-left"><p class="font-bold text-[11px]">Appearance</p><p class="text-[9px] text-gray-500">Banner, PFP, name</p></div></div><span class="text-gray-400">›</span></button>
<button onclick="openPage('manage-accounts')" class="box-premium w-full"><div class="flex items-center gap-3"><div class="icon-circle"><img src="icons/accounts-purple.png" onerror="this.outerHTML='⇄'"></div><div class="text-left"><p class="font-bold text-[11px]">Manage accounts</p><p class="text-[9px] text-gray-500" id="accCountLabel">0 accounts</p></div></div><span class="text-gray-400">›</span></button>
<button onclick="openPage('notifications')" class="box-premium w-full"><div class="flex items-center gap-3"><div class="icon-circle"><img src="icons/bell-purple.png" onerror="this.outerHTML='🔔'"></div><div class="text-left"><p class="font-bold text-[11px]">Notifications</p><p class="text-[9px] text-gray-500" id="notifCountLabel">All caught up</p></div></div><div class="flex items-center gap-2"><span id="notifDot" class="hidden w-2 h-2 bg-[#e11d48] rounded-full"></span><span class="text-gray-400">›</span></div></button>
<button onclick="openPage('bin')" class="box-premium w-full"><div class="flex items-center gap-3"><div class="icon-circle"><img src="icons/bin-purple.png" onerror="this.outerHTML='🗑'"></div><div class="text-left"><p class="font-bold text-[11px]">Bin</p><p class="text-[9px] text-gray-500" id="binCountMain">Deleted</p></div></div><span class="text-gray-400">›</span></button>
<button onclick="openPage('faq')" class="box-premium w-full"><div class="flex items-center gap-3"><div class="icon-circle"><img src="icons/faq-purple.png" onerror="this.outerHTML='?'"></div><p class="font-bold text-[11px]">FAQ</p></div><span class="text-gray-400">›</span></button>
<button onclick="openPage('whatsnew')" class="box-premium w-full"><div class="flex items-center gap-3"><div class="icon-circle"><img src="icons/new-purple.png" onerror="this.outerHTML='✦'"></div><p class="font-bold text-[11px]">What's new</p></div><span class="text-gray-400">›</span></button>
</div>
</div>

<div id="pageContainer" class="hidden">
<button onclick="openPage('main')" class="flex items-center gap-2 text-[11px] font-bold"><span class="w-8 h-8 bg-white/80 backdrop-blur border border-[#ede9fe] rounded-full flex items-center justify-center text-[16px] shadow-sm">‹</span> Back</button>
<div id="dynamicContent" class="mt-4"></div>
</div>
</main>

<script>
const firebaseConfig = { apiKey: "AIzaSyAdEOrnBLg4N7TEDE1WRU6FBjerS6r7Xnw", authDomain: "borahae-fm-f7075.firebaseapp.com", databaseURL: "https://borahae-fm-f7075-default-rtdb.firebaseio.com", projectId: "borahae-fm-f7075" };
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(); const db=firebase.database();
function openSidebar(){sidebar.classList.remove('-translate-x-full');sidebarOverlay.classList.remove('hidden')}
function closeSidebar(){sidebar.classList.add('-translate-x-full');sidebarOverlay.classList.add('hidden')}
function openPage(p){
  if(p==='main'){ settingsMain.classList.remove('hidden'); pageContainer.classList.add('hidden'); return; }
  settingsMain.classList.add('hidden'); pageContainer.classList.remove('hidden');
  let map={'appearance':'settings/appearance.html','manage-accounts':'settings/manage-accounts.html','notifications':'settings/notifications.html','bin':'settings/bin.html','faq':'settings/faq.html','whatsnew':'settings/whatsnew.html'};
  loadFragment(map[p]);
  closeSidebar();
}
async function loadFragment(file){
  try{
    let r=await fetch(file); let t=await r.text();
    let doc=new DOMParser().parseFromString(t,'text/html');
    doc.querySelectorAll('header,aside,#sidebar,#sidebarOverlay').forEach(e=>e.remove());
    dynamicContent.innerHTML=doc.body.innerHTML;
    doc.body.querySelectorAll('script').forEach(s=>{ let ns=document.createElement('script'); ns.textContent=s.textContent; dynamicContent.appendChild(ns); });
  }catch(e){ dynamicContent.innerHTML=`<p class="text-[11px] text-gray-400">${file} not found - file bana</p>`; }
}
auth.onAuthStateChanged(u=>{
  if(u){
    sidebarName.innerText=u.displayName||'ARMY';
    if(u.photoURL){sidebarAvatarImg.src=u.photoURL;sidebarAvatarImg.classList.remove('hidden');sidebarAvatarLetter.classList.add('hidden');}
  }
  let l=JSON.parse(localStorage.getItem('borahae_accounts')||'[]'); document.getElementById('accCountLabel').innerText=l.length+' accounts';
  let d=JSON.parse(localStorage.getItem('borahae_deleted')||'[]'); document.getElementById('binCountMain').innerText=d.length+' items • 60 days';
});
</script></body></html>
