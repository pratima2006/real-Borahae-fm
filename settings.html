<script>
const firebaseConfig = { apiKey: "AIzaSyAdEOrnBLg4N7TEDE1WRU6FBjerS6r7Xnw", authDomain: "borahae-fm-f7075.firebaseapp.com", databaseURL: "https://borahae-fm-f7075-default-rtdb.firebaseio.com", projectId: "borahae-fm-f7075" };
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(); const db=firebase.database();
function openSidebar(){sidebar.classList.remove('-translate-x-full');sidebarOverlay.classList.remove('hidden')}
function closeSidebar(){sidebar.classList.add('-translate-x-full');sidebarOverlay.classList.add('hidden')}
function goProfile(){ const u=auth.currentUser; const uid=u? u.uid : (JSON.parse(localStorage.getItem('borahaeUser')||'{}').uid || 'me'); location.href='profile.html?uid='+uid; }
function openPage(p){
  if(p==='main'){settingsMain.classList.remove('hidden');pageContainer.classList.add('hidden');return;}
  settingsMain.classList.add('hidden');pageContainer.classList.remove('hidden');
  let map={'appearance':'appearance.html','manage-accounts':'manage-accounts.html','notifications':'notifications.html','bin':'bin.html','faq':'faq.html','whatsnew':'whatsnew.html'};
  loadFragment(map[p]); closeSidebar();
}
async function loadFragment(file){
  try{let r=await fetch(file);let t=await r.text();let doc=new DOMParser().parseFromString(t,'text/html');dynamicContent.innerHTML=doc.body.innerHTML;doc.body.querySelectorAll('script').forEach(s=>{let ns=document.createElement('script');ns.textContent=s.textContent;dynamicContent.appendChild(ns);});}catch(e){dynamicContent.innerHTML=`<p class="text-[11px] text-gray-400">${file} not found</p>`;}
}
auth.onAuthStateChanged(u=>{
  if(u){
    sidebarName.innerText=u.displayName||'ARMY';
    if(u.photoURL){sidebarAvatarImg.src=u.photoURL;sidebarAvatarImg.classList.remove('hidden');sidebarAvatarLetter.classList.add('hidden');}
    localStorage.setItem('borahaeUser', JSON.stringify({uid:u.uid, name:u.displayName||'', photo:u.photoURL||'', email:u.email||''}));
  } else {
    try{ let lu=JSON.parse(localStorage.getItem('borahaeUser')||'{}'); if(lu.name){ sidebarName.innerText=lu.name; if(lu.photo){ sidebarAvatarImg.src=lu.photo; sidebarAvatarImg.classList.remove('hidden'); sidebarAvatarLetter.classList.add('hidden'); } } }catch(e){}
  }
  let l=JSON.parse(localStorage.getItem('borahae_accounts')||'[]'); document.getElementById('accCountLabel').innerText=l.length+' accounts'; let d=JSON.parse(localStorage.getItem('borahae_deleted')||'[]'); document.getElementById('binCountMain').innerText=d.length+' items • 60 days';
});
// NEW TAG 12H
const TWELVE_HOURS = 12*60*60*1000;
let latestTimes={notice:0, donate:0, voting:0};
function updateNewTag(){
  const now=Date.now(); let newest=null, newestTime=0;
  for(let k in latestTimes){ if(latestTimes[k] && (now-latestTimes[k] < TWELVE_HOURS)){ if(latestTimes[k] > newestTime){ newestTime=latestTimes[k]; newest=k; } } }
  const el=document.getElementById('newNotice'); if(!el) return;
  if(!newest){ el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  if(newest==='notice') el.className='ml-auto text-white text-[9px] px-1.5 py-0.5 rounded-full font-bold bg-[#f472b6]';
  else if(newest==='donate') el.className='ml-auto text-black text-[9px] px-1.5 py-0.5 rounded-full font-bold bg-[#facc15]';
  else el.className='ml-auto text-white text-[9px] px-1.5 py-0.5 rounded-full font-bold bg-[#22c55e]';
  el.innerText='NEW';
}
db.ref('notices').limitToLast(1).on('value',s=>{ if(!s.val()) return; let last=Object.values(s.val())[0]; latestTimes.notice=last.createdAt||0; updateNewTag(); });
db.ref('borahaeDonates').limitToLast(1).on('value',s=>{ if(!s.val()) return; let last=Object.values(s.val())[0]; latestTimes.donate=last.createdAt||0; updateNewTag(); });
db.ref('donateLinks').limitToLast(1).on('value',s=>{ if(!s.val()) return; let last=Object.values(s.val())[0]; if(last.createdAt > latestTimes.donate) latestTimes.donate=last.createdAt; updateNewTag(); });
db.ref('votings').limitToLast(1).on('value',s=>{ if(!s.val()) return; let last=Object.values(s.val())[0]; latestTimes.voting=last.createdAt||0; updateNewTag(); });
</script></body></html>
