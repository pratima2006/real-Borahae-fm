<!-- OWNER GATE - TOP PE ADD KAR -->
<div id="ownerBar" class="p-3 bg-[#28164f] text-white text-[12px] flex justify-between hidden">
  <span>👑 Owner Mode ON</span><button onclick="exitOwner()" class="underline">Exit</button>
</div>

<script>
// SET YOUR SECRET PIN HERE
const OWNER_PIN = "borahae123"; // isko change kar dena

function checkOwner(){
  let isOwner = localStorage.getItem('isOwner')==='true';
  if(isOwner){
    document.getElementById('ownerBar').classList.remove('hidden');
    document.querySelectorAll('.owner-only').forEach(e=>e.classList.remove('hidden'));
  }
}
function askOwner(){
  let pin = prompt("Enter Owner PIN to edit missions:");
  if(pin===OWNER_PIN){ localStorage.setItem('isOwner','true'); checkOwner(); alert('Owner mode ON 💜');}
  else alert('Wrong PIN');
}
function exitOwner(){ localStorage.removeItem('isOwner'); location.reload(); }

// Long press on title 3 times = owner login (secret)
let clicks=0;
function secretOwnerTrigger(){
  clicks++; if(clicks>=3){ askOwner(); clicks=0; }
  setTimeout(()=>clicks=0, 2000);
}
</script>
