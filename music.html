<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="owner-ai.css"></head><body class="paper-grid">
<header class="flex justify-between p-4 bg-white"><button onclick="location.href='index.html'">← Home</button><b>Music</b></header>
<main class="p-5"><button class="btn-primary" onclick="openAddModal()">+ Add MV / Vid</button><div id="music-list" class="grid grid-cols-2 gap-3 mt-4"></div></main>
<div id="addModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center flex z-50"><div class="bg-white p-5 rounded-2xl w-[90%] max-w-[350px]"><input id="ytLink" class="w-full border p-3 rounded-xl" placeholder="YouTube link" oninput="previewYT(this.value)"><img id="ytThumb" class="hidden w-full rounded-xl mt-2"><p id="ytStatus" class="text-sm mt-2"></p><button class="btn-primary w-full mt-3" onclick="addVideo()">Add</button></div></div>
<div id="video-popup" class="fixed inset-0 bg-black/80 hidden items-center justify-center flex z-50"><div class="bg-white p-4 rounded-2xl w-[90%] max-w-[600px]"><iframe id="yt" class="w-full h-[300px] rounded-xl"></iframe><button class="btn-primary w-full mt-3" onclick="markWatched()">Mark Watched 💜</button><p class="text-center mt-2 cursor-pointer" onclick="closePopup()">✕ Close</p></div></div>
<div id="owner-ai-btn" style="display:none" onclick="toggleAI()">💜 AI</div><div id="owner-ai-panel" class="hidden"><div class="ai-header">Owner AI <span onclick="toggleAI()">✕</span></div><div id="ai-chat"></div><div class="ai-input"><input id="ai-prompt"><button onclick="askOwnerAI()">Send</button></div></div>
<script src="script.js"></script><script src="owner-ai.js"></script></body></html>
