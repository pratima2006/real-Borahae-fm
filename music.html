<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Videos - borahae.fm</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Manrope',sans-serif;background:#fdf8ff;}</style></head><body>
<header class="sticky top-0 z-30 bg-[#fdf8ff]/80 backdrop-blur-md border-b border-[#f3e8ff] px-4 py-3 flex items-center gap-3">
  <button onclick="openSidebar()" class="w-9 h-9 bg-white border rounded-[10px]">☰</button>
  <div class="w-9 h-9 bg-[#7c3aed] rounded-[12px] flex items-center justify-center text-white font-bold">b</div>
  <span class="font-bold">borahae.fm</span>
</header>
<div id="sidebarOverlay" onclick="closeSidebar()" class="fixed inset-0 bg-black/40 z-40 hidden"></div>
<aside id="sidebar" class="fixed top-0 left-0 w-[280px] h-full bg-[#28164f] z-50 -translate-x-full transition-all duration-300 flex flex-col p-5">
  <div class="flex justify-between items-center"><div class="flex items-center gap-2"><div class="w-9 h-9 bg-[#7c3aed] rounded-xl flex items-center justify-center text-white font-bold">b</div><span class="text-white font-bold">borahae.fm</span></div><button onclick="closeSidebar()" class="text-white text-xl">✕</button></div>
  <nav class="mt-10 space-y-1">
    <a href="home.html" class="flex gap-3 px-4 py-3 rounded-full text-white/60">⌂ Home</a>
    <a href="missions.html" class="flex gap-3 px-4 py-3 rounded-full text-white/60">✦ Missions</a>
    <a href="music.html" class="flex gap-3 px-4 py-3 rounded-full bg-white/10 text-white font-bold">▶ Videos</a>
    <a href="history.html" class="flex gap-3 px-4 py-3 rounded-full text-white/60">◫ My History</a>
    <a href="faq.html" class="flex gap-3 px-4 py-3 rounded-full text-white/60">? FAQ</a>
  </nav>
  <div class="mt-auto pt-6 border-t border-white/10"><a href="settings.html" class="flex gap-3 px-4 py-3 text-white/60">⚙ Settings</a></div>
</aside>

<main class="max-w-[600px] mx-auto px-5 pt-8 pb-24">
  <p class="text-[11px] tracking-[3px] text-[#7c3aed] font-bold">YOUR VIDEO SHELF</p>
  <h1 class="text-[38px] font-bold leading-[1.1] mt-2" style="font-family:'Playfair Display'">Bring a favorite in.</h1>
  <p class="text-[14px] text-gray-500 mt-2">Search the videos already on your shelf, or paste a YouTube link. We'll check the metadata before it joins your scrapbook.</p>

  <div class="bg-[#f5f0ff] rounded-[24px] p-5 mt-6 border border-[#ede9fe]">
    <p class="font-bold text-[15px] flex gap-2">🔗 Add MVs / videos for all</p>
    <input id="ytLink" placeholder="youtube.com/watch?v=..." class="w-full mt-4 px-4 py-3 rounded-full border outline-none text-[14px]">
    <button onclick="addVideo()" class="w-full mt-3 bg-[#c4b5fd] text-white py-3 rounded-full font-bold">+ Add to videos</button>
  </div>

  <div id="shelf" class="mt-8 space-y-3"></div>
</main>

<div id="video-popup" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-[60]"><div class="bg-white rounded-[20px] p-3 w-full max-w-[600px]"><div class="aspect-video bg-black rounded-[14px] overflow-hidden"><iframe id="ytPlayer" class="w-full h-full" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe></div><p onclick="closeVideo()" class="text-center text-sm mt-3 cursor-pointer">✕ Close</p></div></div>

<script>
// --- YEH FUNCTION AB SAHI JAGAH HAI, UPAR NAHI DIKHEGA ---
function getYouTubeID(urlOrId){
  if(!urlOrId) return "";
  urlOrId = urlOrId.trim();
  if(urlOrId.length===11 &&!urlOrId.includes("/") &&!urlOrId.includes("?")) return urlOrId;
  let reg = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/;
  let m = urlOrId.match(reg);
  return (m && m[2].length===11)? m[2] : "";
}

const firebaseConfig = {
  apiKey: "AIzaSyAdEoRnBLg4N7TEDE1WRU6FBjcrS6r7XNw",
  authDomain: "borahae-fm-f7075.firebaseapp.com",
  databaseURL: "https://borahae-fm-f7075-default-rtdb.firebaseio.com",
  projectId: "borahae-fm-f7075",
  storageBucket: "borahae-fm-f7075.firebasestorage.app",
  messagingSenderId: "319118277965",
  appId: "1:319118277965:web:eece2a5bf15708aab3cb04"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function openSidebar(){document.getElementById('sidebar').classList.remove('-translate-x-full');document.getElementById('sidebarOverlay').classList.remove('hidden');}
function closeSidebar(){document.getElementById('sidebar').classList.add('-translate-x-full');document.getElementById('sidebarOverlay').classList.add('hidden');}
function openVideo(id){document.getElementById('ytPlayer').src=`https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;document.getElementById('video-popup').classList.remove('hidden');document.getElementById('video-popup').classList.add('flex');}
function closeVideo(){document.getElementById('ytPlayer').src='';document.getElementById('video-popup').classList.add('hidden');}

function addVideo(){
  let link = document.getElementById('ytLink').value;
  let id = getYouTubeID(link);
  if(!id){ alert("Sahi YouTube link daal yaar!"); return; }
  let title = prompt("Video ka naam kya rakhu? (ex: Hooligan)");
  if(!title) title = "BTS Video";
  db.ref('videos').push({title: title, id: id, videoId: id});
  document.getElementById('ytLink').value="";
}

db.ref('videos').on('value', snap=>{
  let data=snap.val();
  let shelf=document.getElementById('shelf');
  if(!data){ shelf.innerHTML="<p class='text-center text-gray-400 text-sm'>No videos yet</p>"; return;}
  let html="";
  Object.values(data).reverse().forEach(v=>{
    let cleanId = getYouTubeID(v.id || v.videoId || "");
    if(!cleanId) return;
    html+=`<div onclick="openVideo('${cleanId}')" class="bg-white border rounded-[16px] p-3 flex gap-3 cursor-pointer">
    <img src="https://img.youtube.com/vi/${cleanId}/hqdefault.jpg" class="w-[64px] h-[64px] rounded-[12px] object-cover">
    <div><p class="font-bold text-[14px]">${v.title}</p><p class="text-[12px] text-gray-500">Tap to play</p></div></div>`;
  });
  shelf.innerHTML=html;
});
</script></body></html>
