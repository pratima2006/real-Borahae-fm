<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Music - borahae.fm</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>body{font-family:'Manrope',sans-serif; background:#fdf8ff;}.paper-grid{background-image:linear-gradient(#e9d5ff1f 1px, transparent 1px),linear-gradient(90deg, #e9d5ff1f 1px, transparent 1px); background-size:22px 22px;}.sidebar-bg{background:#28164f;}</style>
</head><body class="paper-grid">

<!-- HEADER SAME AS HOME/MISSIONS/FAQ -->
<header class="sticky top-0 z-30 bg-[#fdf8ff]/80 backdrop-blur-md border-b border-[#f3e8ff] px-4 py-3 flex items-center gap-3">
  <button onclick="openSidebar()" class="w-9 h-9 bg-white border border-[#ede9fe] rounded-[10px] flex items-center justify-center">☰</button>
  <div class="w-[38px] h-[38px] bg-[#7c3aed] rounded-[14px] flex items-center justify-center text-white font-display text-[22px] font-bold">b</div>
</header>

<!-- SIDEBAR SAME AS ALL PAGES -->
<div id="sidebarOverlay" onclick="closeSidebar()" class="fixed inset-0 bg-black/40 hidden z-40"></div>
<aside id="sidebar" class="fixed top-0 left-0 w-[280px] h-full sidebar-bg z-50 -translate-x-full transition-all duration-300 flex flex-col p-5">
  <div class="flex justify-between items-center">
    <div class="flex items-center gap-3"><div class="w-9 h-9 bg-[#7c3aed] rounded-[14px] flex items-center justify-center text-white font-bold">b</div><span class="text-white font-bold">borahae.fm</span></div>
    <button onclick="closeSidebar()" class="text-white/70 text-[22px]">✕</button>
  </div>
  <nav class="mt-10 space-y-1">
    <a href="home.html" class="flex items-center gap-3 px-4 py-3 rounded-full text-white/60">⌂ Home</a>
    <a href="missions.html" class="flex items-center gap-3 px-4 py-3 rounded-full text-white/60">✦ Missions</a>
    <a href="music.html" class="flex items-center gap-3 px-4 py-3 rounded-full bg-white/10 text-white font-semibold">▶ Videos <span class="ml-auto w-2 h-2 bg-[#f472b6] rounded-full"></span></a>
    <a href="history.html" class="flex items-center gap-3 px-4 py-3 rounded-full text-white/60">◫ My History</a>
    <a href="faq.html" class="flex items-center gap-3 px-4 py-3 rounded-full text-white/60">? FAQ</a>
  </nav>
  <div class="mt-auto pt-6 border-t border-white/10"><a href="settings.html" class="flex gap-3 px-4 py-3 text-white/60">⚙ Settings</a></div>
</aside>

<main class="max-w-[900px] mx-auto p-6">
  <button onclick="openAdd()" class="bg-[#7c3aed] text-white px-6 py-3 rounded-[14px] font-bold text-sm">+ Add MV / Vid</button>
  <div id="music-list" class="grid grid-cols-2 md:grid-cols-3 gap-4 mt-6"></div>
</main>

<!-- Add Modal -->
<div id="addModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-5 z-50"><div class="bg-white rounded-[20px] p-5 w-full max-w-[380px]"><h3 class="font-bold">Add YouTube MV</h3><input id="ytLink" placeholder="Paste YouTube link here" class="w-full border border-gray-200 rounded-xl p-3 mt-3 text-sm"><p id="ytStatus" class="text-xs mt-2 text-gray-500"></p><button onclick="addVideo()" class="w-full bg-[#7c3aed] text-white py-3 rounded-xl mt-3 font-bold">Add</button><p onclick="closeAdd()" class="text-center text-sm mt-3 cursor-pointer">Cancel</p></div></div>

<!-- VIDEO POPUP -->
<div id="video-popup" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-[60]"><div class="bg-white rounded-[20px] p-3 w-full max-w-[600px]"><div class="aspect-video bg-black rounded-[14px] overflow-hidden"><iframe id="ytPlayer" class="w-full h-full" frameborder="0" allowfullscreen></iframe></div><button onclick="markWatched()" class="w-full bg-[#7c3aed] text-white py-3 rounded-xl mt-3 font-bold">Mark Watched 💜</button><p onclick="closeVideo()" class="text-center text-sm mt-3 cursor-pointer">✕ Close</p></div></div>

<script>
// IDOL DELETE - SIRF 2 VIDEOS
let videos = JSON.parse(localStorage.getItem('bts_videos') || '[{"title":"BTS Dynamite Official MV","id":"gdZLi9oWNZg"},{"title":"Butter Official MV","id":"WMweEpGlu_U"}]');
// agar pehle se 3 tha toh filter kar de
videos = videos.filter(v => v.id!== 'pBuZEGgPm_k').slice(0,2);
if(videos.length < 2){
  videos = [{"title":"BTS Dynamite Official MV","id":"gdZLi9oWNZg"},{"title":"Butter Official MV","id":"WMweEpGlu_U"}];
}
localStorage.setItem('bts_videos', JSON.stringify(videos));

function render(){ const list=document.getElementById('music-list'); list.innerHTML=''; videos.forEach(v=>{ list.innerHTML+=`<div onclick="openVideo('${v.id}')" class="bg-white rounded-[14px] overflow-hidden border shadow-sm cursor-pointer"><img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" onerror="this.src='https://img.youtube.com/vi/${v.id}/mqdefault.jpg'" class="w-full aspect-video object-cover"><p class="p-2 text-[13px] font-semibold">${v.title}</p></div>`; }); }
function openSidebar(){document.getElementById('sidebar').classList.remove('-translate-x-full');document.getElementById('sidebarOverlay').classList.remove('hidden');}
function closeSidebar(){document.getElementById('sidebar').classList.add('-translate-x-full');document.getElementById('sidebarOverlay').classList.add('hidden');}
function openAdd(){document.getElementById('addModal').classList.remove('hidden');document.getElementById('addModal').classList.add('flex');}
function closeAdd(){document.getElementById('addModal').classList.add('hidden');document.getElementById('addModal').classList.remove('flex');}
function openVideo(id){document.getElementById('ytPlayer').src=`https://www.youtube.com/embed/${id}?autoplay=1`; document.getElementById('video-popup').classList.remove('hidden'); document.getElementById('video-popup').classList.add('flex'); localStorage.setItem('currentVideo',id);}
function closeVideo(){document.getElementById('ytPlayer').src=''; document.getElementById('video-popup').classList.add('hidden'); document.getElementById('video-popup').classList.remove('flex');}
function markWatched(){alert('Marked as watched 💜 +1 stream!'); closeVideo();}
function addVideo(){const link=document.getElementById('ytLink').value; const id=link.match(/(?:v=|\.be\/)([a-zA-Z0-9_-]{11})/)?.[1]; if(!id){document.getElementById('ytStatus').innerText='Invalid link'; return;} videos.unshift({title:'New MV - '+id, id}); localStorage.setItem('bts_videos',JSON.stringify(videos)); closeAdd(); render();}
render();
</script>
</body></html>
