<script>
// ... tere purane firebaseConfig same ...

if(localStorage.getItem('yt_access_token')){
  document.getElementById('ytWarningBox').classList.add('hidden');
}

// getYouTubeID same...
let videos = JSON.parse(localStorage.getItem('bts_videos') || '[]');
// ... same ...

// YEH FUNCTION DELETE KAR DE - iski wajah se YT app khulta tha
// function saveToYTHistory(videoId){ ... window.open ... }  <- ye pura hata de

function openVideo(id,title){
  currentId=id; currentTitle=title;
  document.getElementById('nowPlaying').innerText=title||"";
  document.getElementById('watchStatus').innerText="Watch 60s without skipping to count 💜";
  document.getElementById('video-popup').classList.remove('hidden');
  document.getElementById('video-popup').classList.add('flex');
  watchSeconds=0; lastTime=0; hasSeeked=false; hasCounted=false;
  clearInterval(watchInterval);
  // saveToYTHistory(id);  <- YE LINE HATA DE, bas ye hi change
  if(player && player.loadVideoById){ player.loadVideoById(id); }
  else { player = new YT.Player('ytPlayer', {height:'100%', width:'100%', videoId:id, playerVars:{autoplay:1, rel:0, modestbranding:1, enablejsapi:1, origin: window.location.origin}, events:{'onStateChange': onPlayerStateChange}}); }
}

// baaki onPlayerStateChange, saveStream, closeVideo same rehne de...

function applyFilters(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  const f=document.getElementById('filterSelect').value;
  let filtered=[...videos];
  if(f==='new'){ filtered=filtered.filter(v=> v.addedAt && Date.now()-v.addedAt < 2*86400000); }
  if(f==='hybe'){ filtered=filtered.filter(v=> (v.channel||'').toLowerCase().includes('hybe')); }
  if(f==='bangtantv'){ filtered=filtered.filter(v=> (v.channel||'').toLowerCase().includes('bangtan')); }
  // NEW FILTERS - solo ke liye
  if(f==='solo'){ filtered=filtered.filter(v=> ['jimin','jungkook',' v ','taehyung','jin','rm','namjoon','jhope','hoseok','suga','yoongi','agust'].some(n=> (v.channel+v.title).toLowerCase().includes(n))); }
  if(q){ filtered=filtered.filter(v=> v.title.toLowerCase().includes(q) || (v.channel||'').toLowerCase().includes(q)); }
  render(filtered);
}
</script>
