<div class="bin-fragment">
<h2 class="font-display text-[20px] font-bold">Bin</h2>
<p class="text-[10px] text-gray-500 mt-1"><span id="binCount">0 items</span> • 60 days auto delete</p>
<div id="deletedList" class="mt-4 space-y-2"></div>
<div id="deletedEmpty" class="hidden text-center py-10 bg-white border border-dashed border-[#f3e8ff] rounded-[16px] mt-4"><p class="text-[11px] text-gray-400">No deleted videos 💜</p></div>
</div>
<script>
(function(){
function renderBin(){
 let del=JSON.parse(localStorage.getItem('borahae_deleted')||'[]'); let now=Date.now();
 del=del.filter(d=>now-d.deletedAt<60*24*60*60*1000); localStorage.setItem('borahae_deleted',JSON.stringify(del));
 let binCount=document.getElementById('binCount'); if(binCount) binCount.innerText=del.length+' items';
 let listEl=document.getElementById('deletedList'); let emptyEl=document.getElementById('deletedEmpty');
 if(!del.length){listEl.innerHTML='';emptyEl.classList.remove('hidden');return;} emptyEl.classList.add('hidden');
 listEl.innerHTML=del.map(d=>{
  let left=60-Math.floor((now-d.deletedAt)/86400000);
  return `<div class="flex gap-2 items-center bg-white border border-[#f3e8ff] rounded-[12px] p-2"><img src="https://img.youtube.com/vi/${d.videoId}/mqdefault.jpg" class="w-[52px] h-[34px] rounded-[6px]"><div class="flex-1 min-w-0"><p class="text-[10px] font-bold truncate">${d.title}</p><p class="text-[8px] text-[#e11d48] font-bold">${left} days left</p></div><button onclick="askRestore('${d.videoId}')" class="w-7 h-7 bg-[#ede6fb] rounded-full text-[11px]">↩</button><button onclick="askBinDelete('${d.videoId}')" class="w-7 h-7 bg-[#fff1f2] rounded-full text-[11px]">🗑</button></div>`;
 }).join('');
}
window.askRestore=(id)=>{window.binTargetId=id;document.getElementById('binRestorePopup').classList.remove('hidden');document.getElementById('binRestorePopup').classList.add('flex');};
window.askBinDelete=(id)=>{window.binTargetId=id;document.getElementById('binDeletePopup').classList.remove('hidden');document.getElementById('binDeletePopup').classList.add('flex');};
renderBin();
})();
</script>
