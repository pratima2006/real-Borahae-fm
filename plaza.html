<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Borahae Plaza - borahae.fm</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Manrope',sans-serif;background:#fdf8ff;color:#1a1033}
.font-display{font-family:'Playfair Display',serif}.font-mono{font-family:'DM Mono',monospace}
.paper-grid{background-image:linear-gradient(#e9d5ff1f 1px, transparent 1px),linear-gradient(90deg, #e9d5ff1f 1px, transparent 1px);background-size:22px 22px}
.sidebar-bg{background:#28164f}
.sticky-composer{position:sticky;top:57px;z-index:20;background:#fdf8ff;padding-bottom:12px}
.modal-bg{backdrop-filter:blur(6px);background:rgba(0,0,0,0.25)}
@keyframes pop{0%{transform:scale(0.92);opacity:0}100%{transform:scale(1);opacity:1}}
.animate-pop{animation:pop 0.2s ease-out}
@keyframes hl{0%{background:#f5f3ff}50%{background:#ede9fe}100%{background:white}}
.highlight{animation:hl 1.5s ease}
.clamp-3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head><body class="paper-grid">

<header id="mainHeader" class="sticky top-0 z-30 bg-[#fdf8ff]/90 backdrop-blur-md border-b border-[#f3e8ff] px-4 py-3 flex items-center gap-3">
<button onclick="handleBack()" class="w-9 h-9 bg-white border border-[#ede9fe] rounded-[10px] flex items-center justify-center text-[18px]">←</button>
<div class="w-[38px] h-[38px] bg-[#7c3aed] rounded-[14px] flex items-center justify-center text-white font-display text-[24px] font-bold">b</div>
<span id="headerTitle" class="font-bold text-[14px]">Borahae Plaza</span>
</header>

<div id="sidebarOverlay" onclick="closeSidebar()" class="fixed inset-0 bg-black/40 hidden z-40"></div>
<aside id="sidebar" class="fixed top-0 left-0 w-[280px] h-full sidebar-bg z-50 -translate-x-full transition-all duration-300 flex flex-col p-5">
<div class="flex items-center justify-between"><div class="flex items-center gap-3"><div class="w-[34px] h-[34px] bg-[#7c3aed] rounded-[12px] flex items-center justify-center text-white font-display text-[20px]">b</div><span class="text-white font-bold text-[16px]">borahae<span class="text-[#a78bfa]">.fm</span></span></div><button onclick="closeSidebar()" class="text-white/70 text-[20px]">✕</button></div>
<nav class="space-y-[2px] mt-6">
<a href="home.html" class="flex items-center gap-3 px-3 py-2.5 rounded-full text-white/60 hover:bg-white/5 text-[13px]">⌂ Home</a>
<a href="plaza.html" class="flex items-center gap-3 px-3 py-2.5 rounded-full bg-white/10 text-white font-semibold text-[13px]">☾ Borahae Plaza</a>
<a href="profile.html" class="flex items-center gap-3 px-3 py-2.5 rounded-full text-white/60 hover:bg-white/5 text-[13px]">◐ Profile</a>
</nav>
<div class="mt-auto"><div id="sideBox" onclick="goProfile()" class="mt-4 bg-white/10 rounded-[14px] p-2.5 flex items-center gap-3 cursor-pointer"><img id="sidePfp" src="https://via.placeholder.com/32" class="w-8 h-8 rounded-full object-cover"><div class="overflow-hidden"><p id="sideName" class="text-white text-[12px] font-bold truncate">ARMY</p><p class="text-white/50 text-[10px]">View profile</p></div></div></div>
</aside>

<!-- MAIN FEED VIEW -->
<main id="feedView" class="max-w-[480px] md:max-w-[600px] mx-auto px-5 pt-6 pb-10">
<div><p class="font-mono text-[11px] tracking-[2.5px] text-[#7c3aed]">YOUR LETTERS · LIVE NOW</p><h1 class="font-display text-[40px] leading-[0.95] font-bold mt-3">Borahae<br><span class="text-[#7c3aed]">Plaza.</span></h1><p class="text-[#6b7280] text-[14px] mt-3">Where whispers turn into letters. Talk, help, and purple each other — quietly, together 💜</p></div>
<div class="flex gap-1.5 mt-5">
<button id="fMine" onclick="setFilter('mine')" class="bg-white border border-[#ede9fe] px-3.5 py-1.5 rounded-full text-[10px] font-bold">My letters</button>
<button id="fOfficial" onclick="setFilter('official')" class="bg-white border border-[#ede9fe] px-3.5 py-1.5 rounded-full text-[10px] font-bold">Borahae-fm</button>
</div>
<div class="sticky-composer mt-4">
<div class="bg-white rounded-[18px] border border-[#f3e8ff] p-2.5 flex gap-2.5 shadow-sm">
<img id="myPfp" src="https://via.placeholder.com/32" class="w-8 h-8 rounded-full object-cover bg-[#f5f3ff] flex-shrink-0">
<div class="flex-1 flex gap-2 items-end"><textarea id="msgInput" placeholder="Write a letter... @mention" class="flex-1 bg-[#faf5ff] border border-[#f3e8ff] rounded-[12px] px-3 py-2 text-[12px] outline-none min-h-[38px] resize-none"></textarea><button onclick="postLetter()" class="bg-[#1a1033] text-white w-8 h-8 rounded-full flex items-center justify-center text-[14px]">↗</button></div>
</div><div class="mt-3 h-[1px] w-full bg-[#e9d5ff]/70"></div></div>
<div id="feed" class="mt-2 space-y-3"></div>
</main>

<!-- DETAIL REPLY PAGE VIEW -->
<main id="detailView" class="hidden max-w-[480px] md:max-w-[600px] mx-auto px-5 pt-4 pb-24">
<div id="detailMain"></div>
<div class="mt-4"><p class="font-mono text-[10px] tracking-[2px] text-[#7c3aed]">REPLIES · <span id="replyCount">0</span></p><div class="mt-1 h-[1px] bg-[#ede9fe]"></div></div>
<div id="detailReplies" class="mt-4 space-y-3"></div>
<div class="fixed bottom-0 left-0 right-0 bg-[#fdf8ff]/95 backdrop-blur border-t border-[#f3e8ff] p-3 flex justify-center z-20"><div class="w-full max-w-[480px] flex gap-2"><img id="detailMyPfp" src="https://via.placeholder.com/32" class="w-8 h-8 rounded-full"><input id="detailInput" placeholder="Write a reply..." class="flex-1 bg-white border border-[#ede9fe] rounded-full px-4 py-2 text-[12px] outline-none"><button onclick="postDetailReply()" class="bg-[#1a1033] text-white w-8 h-8 rounded-full">↗</button></div></div>
</main>

<!-- POPUP -->
<div id="popupModal" class="fixed inset-0 z-[60] hidden modal-bg flex items-end md:items-center justify-center p-4">
<div class="animate-pop bg-white rounded-[22px] w-full max-w-[340px] p-5 shadow-[0_20px_60px_rgba(0,0,0,0.2)]">
<h3 id="popupTitle" class="font-display text-[18px] font-bold"></h3><p id="popupText" class="text-[12px] text-[#6b7280] mt-1"></p>
<textarea id="popupInput" class="hidden w-full mt-3 bg-[#faf5ff] border rounded-[12px] p-2.5 text-[12px] outline-none min-h-[80px]"></textarea>
<input id="popupReason" class="hidden w-full mt-3 bg-[#faf5ff] border rounded-[12px] p-2.5 text-[12px] outline-none" placeholder="Reason...">
<div class="flex gap-2 mt-4"><button onclick="closePopup()" class="flex-1 bg-[#f5f3ff] border py-2.5 rounded-full text-[11px] font-bold">Cancel</button><button id="popupConfirm" class="flex-1 bg-[#1a1033] text-white py-2.5 rounded-full text-[11px] font-bold">Confirm</button></div>
</div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyAdEOrnBLg4N7TEDE1WRU6FBjerS6r7Xnw",authDomain:"borahae-fm-f7075.firebaseapp.com",databaseURL:"https://borahae-fm-f7075-default-rtdb.firebaseio.com",projectId:"borahae-fm-f7075"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db=firebase.database(), auth=firebase.auth();
let currentFilter='all'; let allLetters=[]; let currentDetailId=null;
function getLocal(){ try{return JSON.parse(localStorage.getItem('borahaeUser')||'{}')}catch(e){return{}} }
function goProfile(uid){ if(!uid){let u=getLocal(); uid=auth.currentUser?.uid||u.uid||'me';} location.href='profile.html?uid='+uid; }
function openSidebar(){document.getElementById('sidebar').classList.remove('-translate-x-full');document.getElementById('sidebarOverlay').classList.remove('hidden');}
function closeSidebar(){document.getElementById('sidebar').classList.add('-translate-x-full');document.getElementById('sidebarOverlay').classList.add('hidden');}
function handleBack(){ const p=new URLSearchParams(location.search); if(p.get('post')){ location.href='plaza.html'; } else history.back(); }

auth.onAuthStateChanged(u=>{
  let l=getLocal(); if(u){ document.getElementById('sideName').innerText=u.displayName||'ARMY'; if(u.photoURL){ sidePfp.src=u.photoURL; myPfp.src=u.photoURL; detailMyPfp.src=u.photoURL; } }
  else if(l.name){ sideName.innerText=l.name; if(l.photo){ sidePfp.src=l.photo; myPfp.src=l.photo; detailMyPfp.src=l.photo; } }
});

function setFilter(t){ if(currentFilter===t) t='all'; currentFilter=t; fMine.className=t==='mine'?"bg-[#1a1033] text-white px-3.5 py-1.5 rounded-full text-[10px] font-bold":"bg-white border border-[#ede9fe] px-3.5 py-1.5 rounded-full text-[10px] font-bold"; fOfficial.className=t==='official'?"bg-[#1a1033] text-white px-3.5 py-1.5 rounded-full text-[10px] font-bold":"bg-white border border-[#ede9fe] px-3.5 py-1.5 rounded-full text-[10px] font-bold"; render(); }

function postLetter(){
  let t=msgInput.value.trim(); if(!t) return; let user=auth.currentUser; let l=getLocal();
  let isOfficial = (l.email&&l.email.includes('pratima'))||(user&&user.email&&user.email.includes('pratima'));
  let obj={text:t, uid:user?.uid||l.uid||'anon_'+Date.now(), name:user?.displayName||l.name||'ARMY', pfp:user?.photoURL||l.photo||'', role:isOfficial?'official':'army', createdAt:Date.now(), likes:0};
  // mention notif
  let mentions = [...t.matchAll(/@([a-zA-Z0-9_]+)/g)].map(m=>m[1]);
  db.ref('plaza').push(obj).then(snap=>{
    mentions.forEach(mName=>{
      let target = allLetters.find(x=> x.name.toLowerCase().replace(/\s/g,'').includes(mName.toLowerCase()));
      if(target && target.uid!==obj.uid) db.ref('notifications/'+target.uid).push({type:'mention', fromUid:obj.uid, fromName:obj.name, postId:snap.key, text:t.slice(0,50), time:Date.now()});
    });
  });
  msgInput.value='';
}

db.ref('plaza').limitToLast(150).on('value',s=>{
  let d=s.val(); allLetters=d?Object.entries(d).map(([k,v])=>({...v,_key:k})).sort((a,b)=>b.createdAt-a.createdAt):[];
  const params=new URLSearchParams(location.search);
  if(params.get('post')){ openDetail(params.get('post'), params.get('highlight')); } else { render(); }
});

function getHidden(){ try{return JSON.parse(localStorage.getItem('hiddenPosts')||'[]')}catch(e){return[]} }
function isHidden(id){ return getHidden().includes(id); }

function render(){
  let myUid=auth.currentUser?.uid||getLocal().uid;
  let filtered=allLetters.filter(m=>!isHidden(m._key));
  if(currentFilter==='mine') filtered=filtered.filter(x=>x.uid===myUid);
  if(currentFilter==='official') filtered=filtered.filter(x=>x.role==='official');
  document.getElementById('feedView').classList.remove('hidden'); document.getElementById('detailView').classList.add('hidden');
  if(!filtered.length){ feed.innerHTML=`<div class="border border-dashed border-[#d8b4fe] rounded-[20px] p-8 bg-white text-center mt-2"><p class="text-[12px] text-gray-400">No letters yet 💜</p></div>`; return; }
  feed.innerHTML=filtered.map(m=> buildCard(m, true)).join('');
}

function buildCard(m, isMain, showFull=false){
  let myUid=auth.currentUser?.uid||getLocal().uid; let isMe=m.uid===myUid; let isOfficial=m.role==='official'; let liked=m.likedBy&&m.likedBy[myUid];
  let long = m.text.length>150 || m.text.split('\n').length>3; let displayText =!showFull && long? `<div class="clamp-3">${formatText(m.text)}</div><button onclick="toggleFull('${m._key}')" class="text-[10px] text-gray-400 mt-1 font-bold">View full</button>` : `${formatText(m.text)}${long && showFull?`<br><button onclick="toggleFull('${m._key}')" class="text-[10px] text-gray-400 mt-1 font-bold">View less</button>`:''}`;
  let cardClick = isMain? `onclick="location.href='plaza.html?post=${m._key}'"` : '';
  return `<div id="card-${m._key}" ${isMain?'':''} class="${isOfficial?'bg-gradient-to-br from-[#7c3aed] to-[#4c1d95] text-white border-[#7c3aed]':'bg-white border-[#f3e8ff]'} ${isMain?'cursor-pointer':''} border rounded-[20px] p-3.5 shadow-sm ${isMain?'':'ml-6 relative'}">
    ${!isMain?`<div class="absolute -left-3 top-4 w-3 h-[2px] bg-[#e9d5ff]"></div>`:''}
    <div class="flex justify-between items-start"><div class="flex gap-2.5 items-center cursor-pointer" onclick="event.stopPropagation(); goProfile('${m.uid}')"><img src="${m.pfp||'https://via.placeholder.com/32'}" class="w-8 h-8 rounded-full"><div><div class="flex items-center gap-1"><p class="font-bold text-[${isMain?'12':'11'}px] leading-none">${m.name}</p>${isOfficial?'<span class="bg-white text-[#7c3aed] text-[7px] px-1.5 py-0.5 rounded-full font-bold">OFFICIAL</span>':''}</div><p class="text-[10px] ${isOfficial?'text-white/60':'text-gray-400'} mt-1">${new Date(m.createdAt).toLocaleDateString()}</p></div></div>
      <div class="relative"><button onclick="event.stopPropagation(); toggleMenu('${m._key}')" class="w-7 h-7 ${isOfficial?'bg-white/15':'bg-[#faf5ff] border'} rounded-full flex items-center justify-center">⋯</button>
        <div id="menu-${m._key}" class="hidden absolute right-0 top-8 bg-white border rounded-[14px] shadow-xl p-1.5 w-[150px] z-30">
          ${isMe?`<button onclick="event.stopPropagation(); openDelete('${m._key}', '${isMain?'post':'reply'}')" class="w-full text-left px-3 py-2 text-[11px] font-bold rounded-full hover:bg-gray-50 text-[#e11d48]">Delete</button><button onclick="event.stopPropagation(); openEdit('${m._key}')" class="w-full text-left px-3 py-2 text-[11px] font-bold rounded-full hover:bg-gray-50 text-black">Edit</button>`:`<button onclick="event.stopPropagation(); goProfile('${m.uid}')" class="w-full text-left px-3 py-2 text-[11px] font-bold rounded-full bg-[#f5f3ff] text-[#7c3aed]">View profile 💜</button><button onclick="event.stopPropagation(); openReport('${m._key}')" class="w-full text-left px-3 py-2 text-[11px] font-bold rounded-full text-[#e11d48] hover:bg-[#fff1f2] mt-1">Report</button>`}
        </div></div></div>
    <div ${cardClick} class="text-[${isMain?'12':'11'}px] mt-3 leading-[1.6] whitespace-pre-wrap">${displayText}</div>
    <div class="flex items-center gap-3 mt-3">
      <button onclick="event.stopPropagation(); toggleLike('${m._key}', '${isMain?'':'reply'}')" class="flex items-center gap-1 text-[13px]"><span class="${liked?'text-[#7c3aed]':'text-gray-400'}">${liked?'♥':'♡'}</span><span class="text-[10px] ${isOfficial?'text-white/80':'text-gray-500'} font-bold">${m.likes||0}</span></button>
      <button onclick="event.stopPropagation(); ${isMain?`location.href='plaza.html?post=${m._key}'`:`focusReply('${m.name}')`}" class="flex items-center gap-1 text-gray-400 text-[11px]"><span>↩</span><span class="text-[10px] font-bold">${isMain?(m.replies?Object.keys(m.replies).length+' Reply':'Reply'):'Reply'}</span></button>
    </div>
  </div>`;
}

function toggleFull(k){ let el=document.getElementById('card-'+k); // simple reload full toggle via re-render with flag
  // quick: toggle clamp
  let isClamped = el.querySelector('.clamp-3'); if(isClamped){ el.querySelector('.clamp-3').classList.remove('clamp-3'); } else location.reload();
}

function formatText(txt){ return txt.replace(/@([a-zA-Z0-9_]+)/g,(m,name)=>`<span onclick="event.stopPropagation(); findAndGoProfile('${name}')" class="${txt.includes('official')?'text-white underline':'text-[#7c3aed]'} font-bold cursor-pointer hover:underline">@${name}</span>`); }
function findAndGoProfile(name){ let f=allLetters.find(l=> l.name.toLowerCase().replace(/\s/g,'').includes(name.toLowerCase())); if(f) goProfile(f.uid); }

function toggleMenu(k){ let el=document.getElementById('menu-'+k); document.querySelectorAll('[id^=menu-]').forEach(x=>{ if(x.id!==el.id) x.classList.add('hidden'); }); el.classList.toggle('hidden'); }

// DETAIL PAGE
function openDetail(postId, highlightId){
  currentDetailId=postId; let post=allLetters.find(x=>x._key===postId); if(!post){ render(); return; }
  document.getElementById('feedView').classList.add('hidden'); document.getElementById('detailView').classList.remove('hidden');
  headerTitle.innerText='Replies';
  document.getElementById('detailMain').innerHTML=buildCard(post, true, true);
  let replies = post.replies? Object.entries(post.replies).map(([k,v])=>({...v,_key:k, parent:postId})).sort((a,b)=>a.createdAt-b.createdAt):[];
  document.getElementById('replyCount').innerText=replies.length;
  document.getElementById('detailReplies').innerHTML=replies.map(r=> buildCard(r,false,true)).join('')||`<p class="text-[11px] text-gray-400 text-center py-4">No replies yet. Be first 💜</p>`;
  if(highlightId){ setTimeout(()=>{ let c=document.getElementById('card-'+highlightId); if(c){ c.scrollIntoView({behavior:'smooth',block:'center'}); c.classList.add('highlight'); setTimeout(()=>c.classList.remove('highlight'),1500); } },300); }
  db.ref('plaza/'+postId+'/replies').on('value',s=>{
    let d=s.val(); let list=d?Object.entries(d).map(([k,v])=>({...v,_key:k})).sort((a,b)=>a.createdAt-b.createdAt):[];
    document.getElementById('replyCount').innerText=list.length; document.getElementById('detailReplies').innerHTML=list.map(r=> buildCard(r,false,true)).join('')||`<p class="text-[11px] text-gray-400 text-center py-4">No replies yet.</p>`;
  });
}
function postDetailReply(replyTo){
  let t=document.getElementById('detailInput').value.trim(); if(!t) return; let user=auth.currentUser; let l=getLocal();
  let obj={text:t, uid:user?.uid||l.uid||'anon_'+Date.now(), name:user?.displayName||l.name||'ARMY', pfp:user?.photoURL||l.photo||'', createdAt:Date.now(), likes:0, replyTo: replyTo||null};
  db.ref('plaza/'+currentDetailId+'/replies').push(obj).then(()=>{
    // notif to post owner
    let main=allLetters.find(x=>x._key===currentDetailId); if(main && main.uid!==obj.uid) db.ref('notifications/'+main.uid).push({type:'reply', fromUid:obj.uid, fromName:obj.name, postId:currentDetailId, text:`${obj.name} replied to your comment '${main.text.slice(0,20)}'`, time:Date.now()});
    // mention notif in reply
    let mentions=[...t.matchAll(/@([a-zA-Z0-9_]+)/g)].map(m=>m[1]); mentions.forEach(mName=>{ let target=allLetters.find(x=> x.name.toLowerCase().replace(/\s/g,'').includes(mName.toLowerCase())); if(target && target.uid!==obj.uid) db.ref('notifications/'+target.uid).push({type:'mention', fromUid:obj.uid, fromName:obj.name, postId:currentDetailId, text:t.slice(0,50), time:Date.now()}); });
  });
  document.getElementById('detailInput').value='';
}
function focusReply(name){ document.getElementById('detailInput').value='@'+name+' '; document.getElementById('detailInput').focus(); }
function toggleLike(k, type){
  let myUid=auth.currentUser?.uid||getLocal().uid||'anon'; let path = type==='reply'? 'plaza/'+currentDetailId+'/replies/'+k : 'plaza/'+k;
  db.ref(path).transaction(curr=>{ if(!curr) return curr; curr.likedBy=curr.likedBy||{}; curr.likes=curr.likes||0; if(curr.likedBy[myUid]){ delete curr.likedBy[myUid]; curr.likes=Math.max(0,curr.likes-1); } else { curr.likedBy[myUid]=true; curr.likes++; if(type!=='reply'){ let post=allLetters.find(x=>x._key===k); if(post && post.uid!==myUid) db.ref('notifications/'+post.uid).push({type:'like', fromUid:myUid, fromName: getLocal().name||'ARMY', postId:k, text: post.text.slice(0,30), time:Date.now()}); } } return curr; });
}

// POPUPS
function openPopup(title,text,confirmText,onConfirm,showInput,showReason){
  popupTitle.innerText=title; popupText.innerText=text;
  popupInput.classList.add('hidden'); popupReason.classList.add('hidden');
  if(showInput) popupInput.classList.remove('hidden'); if(showReason) popupReason.classList.remove('hidden');
  popupConfirm.innerText=confirmText; popupModal.classList.remove('hidden');
  popupConfirm.onclick=()=>{ onConfirm(); closePopup(); };
}
function closePopup(){ popupModal.classList.add('hidden'); }
function openDelete(k, typ){ openPopup('Delete?','This cannot be undone.','Delete',()=>{ let path = typ==='reply'? 'plaza/'+currentDetailId+'/replies/'+k : 'plaza/'+k; db.ref(path).remove(); if(typ!=='reply' && currentDetailId===k) location.href='plaza.html'; }); }
function openEdit(k){ let cur=allLetters.find(x=>x._key===k) || null; // also check replies
  if(!cur && currentDetailId){ db.ref('plaza/'+currentDetailId+'/replies/'+k).once('value',s=>{ cur=s.val(); if(cur){ popupInput.value=cur.text; openPopup('Edit reply','Update','Save',()=>{ let v=popupInput.value.trim(); if(v) db.ref('plaza/'+currentDetailId+'/replies/'+k).update({text:v}); }, true,false); } }); return; }
  popupInput.value=cur.text; openPopup('Edit letter','Update','Save',()=>{ let v=popupInput.value.trim(); if(v) db.ref('plaza/'+k).update({text:v}); }, true,false); }
function openReport(k){ openPopup('Report?','Reason?','Report',()=>{ let r=popupReason.value.trim(); if(r){ db.ref('reports/'+k).push({reason:r,time:Date.now(),by:auth.currentUser?.uid||'anon'}); // hide for me
    let hidden=JSON.parse(localStorage.getItem('hiddenPosts')||'[]'); hidden.push(k); localStorage.setItem('hiddenPosts', JSON.stringify(hidden)); render();
    let post=allLetters.find(x=>x._key===k); if(post) db.ref('notifications/'+post.uid).push({type:'report', postId:k, text:post.text.slice(0,30), time:Date.now()}); } }, false,true); }
popupModal.addEventListener('click',e=>{ if(e.target.id==='popupModal') closePopup(); });
</script></body></html>
