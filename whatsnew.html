<main class="w-full max-w-[480px] mx-auto px-4 pt-5">
<p class="font-mono text-[11px] tracking-[3px] text-[#7c3aed] font-bold">YOUR UPDATES</p>
<h1 class="font-display text-[32px] leading-[0.95] font-bold mt-1">What's new?</h1>
<p class="text-[#6b7280] text-[11px] mt-2 leading-[1.4]">All the little changes, fixes and new drops in the app — straight from us 💜</p>

<!-- OWNER ONLY ADD BOX -->
<div id="ownerBox" class="hidden mt-4 bg-[#f3edff] rounded-[20px] p-3.5 border">
<p class="font-bold text-[11px]">Owner: Add What's New ✨</p>
<input id="wVersion" placeholder="Version e.g. v2.2" class="w-full mt-2 bg-white border rounded-full px-3 py-2 text-[11px] outline-none">
<input id="wTitle" placeholder="Title e.g. New memoir page added" class="w-full mt-2 bg-white border rounded-full px-3 py-2 text-[11px] outline-none">
<textarea id="wDesc" placeholder="What changed? Description" class="w-full mt-2 bg-white border rounded-[12px] px-3 py-2 text-[11px] outline-none"></textarea>
<input id="wImg" type="file" accept="image/*" class="w-full mt-2 text-[10px]">
<button onclick="addWhatsNew()" class="mt-2 w-full bg-[#7c3aed] text-white py-2 rounded-full text-[11px] font-bold">Add update + auto date/time</button>
</div>

<div id="whatsnewList" class="mt-5 space-y-2"></div>
</main>

<script>
const firebaseConfig={apiKey:"AIzaSyAdEOrnBLg4N7TEDE1WRU6FBjerS6r7Xnw",authDomain:"borahae-fm-f7075.firebaseapp.com",databaseURL:"https://borahae-fm-f7075-default-rtdb.firebaseio.com",projectId:"borahae-fm-f7075"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db=firebase.database(); const auth=firebase.auth();
const OWNERS=['pratimatribhuvan2006@gmail.com','tribhuvanpratima38@gmail.com'];
let isOwner=false;

auth.onAuthStateChanged(user=>{
  if(user){
    let name=user.displayName||localStorage.getItem('army_name')||'ARMY';
    document.getElementById('sidebarName').innerText=name;
    let pic=user.photoURL||localStorage.getItem('army_pfp')||'';
    if(pic){ document.getElementById('sidebarAvatarImg').src=pic; document.getElementById('sidebarAvatarImg').classList.remove('hidden'); document.getElementById('sidebarAvatarLetter').classList.add('hidden'); }
    if(OWNERS.includes(user.email.toLowerCase())){ isOwner=true; document.getElementById('ownerBox').classList.remove('hidden'); }
  } else {
    try{ let u=JSON.parse(localStorage.getItem('borahaeUser')||'{}'); if(u.name){ document.getElementById('sidebarName').innerText=u.name; if(u.photo){ document.getElementById('sidebarAvatarImg').src=u.photo; document.getElementById('sidebarAvatarImg').classList.remove('hidden'); document.getElementById('sidebarAvatarLetter').classList.add('hidden'); } } }catch(e){}
  }
  loadWhatsNew();
});

function openSidebar(){ document.getElementById('sidebar').classList.remove('-translate-x-full'); document.getElementById('sidebarOverlay').classList.remove('hidden'); }
function closeSidebar(){ document.getElementById('sidebar').classList.add('-translate-x-full'); document.getElementById('sidebarOverlay').classList.add('hidden'); }

function fileToBase64(f){ return new Promise(r=>{ let rd=new FileReader(); rd.onload=e=>r(e.target.result); rd.readAsDataURL(f); }); }

async function addWhatsNew(){
  if(!isOwner) return alert('Only owner');
  let version=document.getElementById('wVersion').value.trim()||'v'+Date.now();
  let title=document.getElementById('wTitle').value.trim();
  let desc=document.getElementById('wDesc').value.trim();
  if(!title) return alert('Title daal');
  let img=''; let file=document.getElementById('wImg').files[0]; if(file) img=await fileToBase64(file);
  db.ref('whatsnew').push({version,title,desc,img,date:new Date().toLocaleDateString(),time:new Date().toLocaleTimeString(),createdAt:Date.now()});
  document.getElementById('wTitle').value=''; document.getElementById('wDesc').value=''; document.getElementById('wVersion').value=''; document.getElementById('wImg').value='';
}

function loadWhatsNew(){
  db.ref('whatsnew').on('value',snap=>{
    let d=snap.val(); let arr=d?Object.values(d).sort((a,b)=>b.createdAt-a.createdAt):[];
    let el=document.getElementById('whatsnewList');
    if(!arr.length){
      el.innerHTML=`<div class="border-[1.5px] border-dashed border-[#d8b4fe] rounded-[20px] p-6 bg-white/50 text-center"><div class="w-10 h-10 bg-[#f5f3ff] rounded-[12px] flex items-center justify-center mx-auto text-[#7c3aed]">✦</div><p class="text-[12px] text-[#9ca3af] mt-3">No updates yet</p><p class="text-[10px] text-[#c4b5fd] mt-1">When we ship something new, it will show here</p></div>`;
      return;
    }
    el.innerHTML=arr.map(n=>`<div class="bg-white border rounded-[16px] p-3 relative overflow-hidden">
      <div class="flex justify-between items-center"><span class="text-[9px] bg-[#1a1033] text-white px-2 py-0.5 rounded-full font-bold">${n.version||'NEW'}</span><span class="text-[9px] text-gray-400">${n.date||''} • ${n.time||''}</span></div>
      <h3 class="font-bold text-[12px] mt-2 leading-[1.3]">${n.title}</h3>
      <p class="text-[11px] text-[#6b7280] mt-1 leading-[1.4]">${n.desc||''}</p>
      ${n.img?`<img src="${n.img}" class="w-full mt-2 rounded-[12px] border">`:''}
    </div>`).join('');
  });
}
</script></body></html>
