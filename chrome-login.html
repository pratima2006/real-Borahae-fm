<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Google Login • borahae.fm</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<style>
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    box-sizing:border-box;
    background:#fdf8ff;
    font-family:Arial,sans-serif;
    color:#1e1033;
    text-align:center;
  }
  .box{
    width:min(340px,100%);
    background:#fff;
    border:1px solid #eee6f8;
    border-radius:22px;
    padding:28px 22px;
    box-shadow:0 15px 45px rgba(30,16,51,.10);
  }
  .logo{
    width:46px;
    height:46px;
    margin:0 auto 14px;
    border-radius:14px;
    background:#7c3aed;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:700;
  }
  h3{margin:0;font-size:17px}
  p{font-size:12px;color:#6b7280;line-height:1.5}
  .small{font-size:10px;color:#9ca3af}
</style>
</head>

<body>
  <div class="box">
    <div class="logo">b</div>
    <h3 id="title">Continue with Google</h3>
    <p id="msg">Google sign-in is opening. Please wait…</p>
    <p class="small">borahae.fm</p>
  </div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAdEOrnBLg4N7TEDE1WRU6FBjerS6r7Xnw",
  authDomain: "borahae-fm-f7075.firebaseapp.com",
  databaseURL: "https://borahae-fm-f7075-default-rtdb.firebaseio.com",
  projectId: "borahae-fm-f7075",
  storageBucket: "borahae-fm-f7075.firebasestorage.app",
  messagingSenderId: "319118277965",
  appId: "1:319118277965:web:eece2a5bf15708aab3cb04"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});

const provider = new firebase.auth.GoogleAuthProvider();
provider.setCustomParameters({prompt:'select_account'});

// This must be the public HTTPS URL that you configure in your
// Niotron Deep Link extension.
// Example:
// https://borahae-fm-app.vercel.app/index.html
const CALLBACK_BASE =
  "https://borahae-fm-app.vercel.app/index.html";

function setMessage(text){
  document.getElementById("msg").innerText = text;
}

function fail(err){
  console.error(err);
  document.getElementById("title").innerText = "Google sign-in failed";
  setMessage(err && err.message ? err.message : String(err));
}

async function login(){
  try{
    setMessage("Choose your Google account…");

    const result = await auth.signInWithPopup(provider);
    const user = result.user;

    // IMPORTANT:
    // This is the Google OAuth access token from the credential.
    // The APK's index.html uses it with GoogleAuthProvider.credential()
    // to establish Firebase Auth inside the WebView.
    const credential = result.credential;
    const accessToken = credential && credential.accessToken;

    if(!accessToken){
      throw new Error("Google access token was not returned.");
    }

    try{
      await db.ref("users/"+user.uid).update({
        email: user.email || "",
        name: user.displayName || "",
        photo: user.photoURL || "",
        lastLogin: Date.now()
      });
    }catch(e){
      // Authentication can still continue if the database write is blocked.
      console.warn("Database update failed:", e);
    }

    setMessage("Success! Returning to borahae.fm…");

    const callback =
      CALLBACK_BASE +
      "?google_callback=1" +
      "&access_token=" + encodeURIComponent(accessToken) +
      "&email=" + encodeURIComponent(user.email || "");

    // Give Chrome a moment to paint the success message, then return.
    setTimeout(()=>{
      window.location.replace(callback);
    }, 250);

  }catch(err){
    if(err && err.code === "auth/popup-closed-by-user"){
      setMessage("Google window was closed. You can go back and try again.");
      return;
    }
    fail(err);
  }
}

login();
</script>
</body>
</html>
