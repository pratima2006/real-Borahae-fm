<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head><body style="font-family:sans-serif;text-align:center;padding:40px;background:#fdf8ff">
<h3 style="color:#7c3aed">Logging in with Google... 💜</h3>
<p style="font-size:11px;color:#6b7280">Please wait...</p>
<script>
const OWNER_EMAILS = ["pratimatribhuvan2006@gmail.com"];
const firebaseConfig = { apiKey: "AIzaSyAdEOrnBLg4N7TEDE1WRU6FBjerS6r7Xnw", authDomain: "borahae-fm-f7075.firebaseapp.com", databaseURL: "https://borahae-fm-f7075-default-rtdb.firebaseio.com", projectId: "borahae-fm-f7075" };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
let provider = new firebase.auth.GoogleAuthProvider();
provider.setCustomParameters({prompt:'select_account'});
auth.signInWithPopup(provider).then(async (result)=>{
  await db.ref('users/'+result.user.uid).update({email:result.user.email, name:result.user.displayName, photo:result.user.photoURL, lastLogin:Date.now()}).catch(()=>{});
  let data = {email:result.user.email, name:result.user.displayName, photo:result.user.photoURL, uid:result.user.uid};
  try{
    localStorage.setItem('borahae_chrome_google', JSON.stringify(data));
    localStorage.setItem('borahaeUser', JSON.stringify({uid:data.uid,email:data.email,name:data.name,photo:data.photo}));
    localStorage.setItem('borahae_last_active',data.email);
    localStorage.setItem('borahae_is_owner', OWNER_EMAILS.includes(data.email.toLowerCase())?'true':'false');
    if(window.AppInventor){ window.AppInventor.setWebViewString("GOOGLE_SUCCESS::"+data.email); }
  }catch(e){}
  let url = "index.html?google_login=1&email="+encodeURIComponent(data.email)+"&name="+encodeURIComponent(data.name)+"&photo="+encodeURIComponent(data.photo||"")+"&uid="+encodeURIComponent(data.uid);
  setTimeout(()=>{ window.location.href = url; }, 700);
}).catch(e=>{ document.body.innerHTML = "<p>Error: "+e.message+"</p><a href='index.html'>Go back</a>"; });
</script></body></html>
