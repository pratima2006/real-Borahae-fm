<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head><body style="font-family:sans-serif;text-align:center;padding:40px;background:#fdf8ff">
<h3 style="color:#7c3aed">Logging in with Google... 💜</h3>
<p style="color:#6b7280;font-size:12px">Please wait, opening your scrapbook</p>
<script>
const OWNER_EMAILS = ["pratimatribhuvan2006@gmail.com"];
const firebaseConfig = { apiKey: "AIzaSyAdEOrnBLg4N7TEDE1WRU6FBjerS6r7Xnw", authDomain: "borahae-fm-f7075.firebaseapp.com", databaseURL: "https://borahae-fm-f7075-default-rtdb.firebaseio.com", projectId: "borahae-fm-f7075" };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});

let provider = new firebase.auth.GoogleAuthProvider();
provider.setCustomParameters({prompt:'select_account'});

auth.signInWithPopup(provider).then(async (result)=>{
  try{
    await db.ref('users/'+result.user.uid).update({email:result.user.email, name:result.user.displayName, photo:result.user.photoURL, lastLogin:Date.now(), joinDate:new Date().toLocaleDateString(), createdAt: Date.now()});
  }catch(e){}

  let data = {email:result.user.email, name:result.user.displayName, photo:result.user.photoURL, uid:result.user.uid};

  // SAME LOGIC AS index.html saveToMulti
  try{
    localStorage.setItem('borahae_chrome_google', JSON.stringify(data));

    let list=JSON.parse(localStorage.getItem('borahae_accounts')||'[]');
    let obj={uid:data.uid,email:data.email,name:data.name,photo:data.photo};
    let i=list.findIndex(a=>a.email.toLowerCase()===obj.email.toLowerCase());
    if(i>-1) list[i]={...list[i],...obj}; else list.push(obj);
    localStorage.setItem('borahae_accounts', JSON.stringify(list));
    localStorage.setItem('borahaeUser', JSON.stringify(obj));
    localStorage.setItem('borahae_last_active', obj.email);
    localStorage.setItem('army_name', obj.name);
    if(obj.photo) localStorage.setItem('army_pfp', obj.photo);

    let isOwner = OWNER_EMAILS.includes(obj.email.toLowerCase());
    localStorage.setItem('borahae_is_owner', isOwner? 'true' : 'false');
  }catch(e){ console.log(e); }

  // Niotron signals - IMPORTANT FOR APK
  try{
    if(window.AppInventor){
      window.AppInventor.setWebViewString("GOOGLE_SUCCESS::"+data.email);
      window.AppInventor.setWebViewString("Streamed");
    }
  }catch(e){}

  // Redirect back to index - index will read borahae_chrome_google
  window.location.href = "index.html?google_login=1";

}).catch(e=>{
  document.body.innerHTML = "<p style='color:#e11d48'>Error: "+e.message+"</p><p style='font-size:11px;color:#6b7280'>Popup blocked? Try again</p><a href='index.html' style='display:inline-block;margin-top:12px;background:#7c3aed;color:white;padding:10px 18px;border-radius:999px;text-decoration:none;font-size:12px;font-weight:bold'>Go back</a>";
});
</script></body></html>
