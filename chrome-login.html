<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head><body style="font-family:sans-serif;text-align:center;padding:40px;background:#fdf8ff">
<h3>Logging in with Google...</h3>
<script>
const firebaseConfig = { apiKey: "AIzaSyAdEOrnBLg4N7TEDE1WRU6FBjerS6r7Xnw", authDomain: "borahae-fm-f7075.firebaseapp.com", databaseURL: "https://borahae-fm-f7075-default-rtdb.firebaseio.com", projectId: "borahae-fm-f7075" };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(); const db=firebase.database();
let provider = new firebase.auth.GoogleAuthProvider();
auth.signInWithPopup(provider).then(async (result)=>{
  await db.ref('users/'+result.user.uid).update({email:result.user.email, name:result.user.displayName, photo:result.user.photoURL, lastLogin:Date.now()});
  let data = {email:result.user.email, name:result.user.displayName, photo:result.user.photoURL, uid:result.user.uid};
  localStorage.setItem('borahae_chrome_google', JSON.stringify(data));
  localStorage.setItem('borahaeUser', JSON.stringify({email:data.email, name:data.name, photo:data.photo, uid:data.uid}));
  // Niotron ko signal
  if(window.AppInventor) window.AppInventor.setWebViewString("GOOGLE_SUCCESS::"+data.email);
  window.location.href = "index.html?google_login=1";
}).catch(e=>{ document.body.innerHTML = "<p>Error: "+e.message+"</p><a href='index.html'>Go back</a>"; });
</script></body></html>
