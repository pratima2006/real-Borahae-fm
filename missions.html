<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Missions - borahae.fm</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Manrope',sans-serif;background:#fdf8ff}</style>
</head><body>
<header class="sticky top-0 z-20 bg-[#fdf8ff] border-b px-4 py-3 flex items-center gap-3"><div class="w-9 h-9 bg-[#7c3aed] rounded-xl flex items-center justify-center text-white font-bold">b</div><span class="font-bold">borahae.fm</span></header>
<main class="max-w-[480px] mx-auto p-5 pb-24">
<p class="text-[11px] tracking-[2px] text-[#7c3aed] font-bold">STARTER MISSIONS / BANGTANTV</p>
<h1 class="text-[34px] font-bold leading-[1.1] mt-2" style="font-family:'Playfair Display'">A little mission for today.</h1>
<div id="list" class="mt-8 space-y-4"><p class="text-center text-gray-400 text-[13px] mt-10">Loading missions... 💜</p></div>
</main>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAdEoRnBLg4N7TEDE1WRU6FBjcrS6r7XNw",
  authDomain: "borahae-fm-f7075.firebaseapp.com",
  databaseURL: "https://borahae-fm-f7075-default-rtdb.firebaseio.com",
  projectId: "borahae-fm-f7075",
  storageBucket: "borahae-fm-f7075.firebasestorage.app",
  messagingSenderId: "319118277965",
  appId: "1:319118277965:web:eece2a5bf15708aab3cb04"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

db.ref('missions').on('value', (snap)=>{
  let data = snap.val();
  if(!data){
    data = {
      m1: {title:"Dynamite",desc:"Stream Dynamite 12 times today",id:"gdZLi9oWNZg",goal:12},
      m2: {title:"Butter",desc:"Stream Butter 12 times today",id:"WMweEpGlu_U",goal:12}
    };
    db.ref('missions').set(data);
  }
  let html='';
  Object.values(data).forEach(m=>{
    html+=`<div class="bg-white border rounded-[20px] p-4 flex gap-4 items-center shadow-sm">
    <img src="https://img.youtube.com/vi/${m.id}/mqdefault.jpg" class="w-[70px] h-[70px] rounded-[16px] object-cover">
    <div class="flex-1"><p class="font-bold text-[14px]">${m.title}</p><p class="text-[12px] text-gray-500">${m.desc}</p><div class="w-full h-1 bg-gray-100 rounded-full mt-2"><div class="h-1 bg-[#7c3aed] rounded-full" style="width:0%"></div></div><p class="text-[11px] text-gray-400 mt-1">0 / ${m.goal} streams</p></div><div class="text-[#7c3aed] font-bold text-[13px]">0%</div></div>`;
  });
  document.getElementById('list').innerHTML=html;
});
</script></body></html>
