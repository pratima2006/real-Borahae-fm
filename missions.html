<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Missions - Borahae FM</title>
<style>
body{font-family:system-ui;background:#f5f3ff;padding:16px}
.mission{background:#fff;padding:16px;border-radius:16px;margin:12px 0;box-shadow:0 4px 12px #0001}
.badge{padding:4px 10px;border-radius:20px;color:#fff;font-size:12px}
.high{background:#ff3b30}.med{background:#ff9500}.low{background:#8e8e93}
</style>
</head>
<body>
<h2>💜 Streaming Missions</h2>
<div id="missions">Loading...</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAdEOrnBLg4N7TEDE1WRU6FBjerS6r7Xnw",
  authDomain: "borahae-fm-f7075.firebaseapp.com",
  databaseURL: "https://borahae-fm-f7075-default-rtdb.firebaseio.com",
  projectId: "borahae-fm-f7075",
  storageBucket: "borahae-fm-f7075.firebasestorage.app",
  messagingSenderId: "319118277965",
  appId: "1:319118277965:web:eece2a5bf15708aab3cb04"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

db.ref("missions").on("value", snap=>{
  const container = document.getElementById('missions');
  container.innerHTML="";
  const data = snap.val();
  if(!data){ container.innerHTML="No missions yet"; return; }

  const sorted = Object.entries(data).sort((a,b)=>{
    const order = {high:3, medium:2, low:1};
    return (order[b[1].priority]||0) - (order[a[1].priority]||0);
  });

  sorted.forEach(([key, v])=>{
    const div = document.createElement("div");
    div.className="mission";
    div.innerHTML = `
      <div style="display:flex;justify-content:space-between"><b>${v.title}</b><span class="badge ${v.priority=='high'?'high':v.priority=='medium'?'med':'low'}">${v.priority}</span></div>
      <small>🔁 Streamed ${v.totalStreams||0} times by ARMY</small>
      <div style="margin-top:10px;position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:12px">
        <iframe style="position:absolute;top:0;left:0;width:100%;height:100%" src="https://www.youtube.com/embed/${v.videoId}" frameborder="0" allowfullscreen onclick="countStream('${key}')"></iframe>
      </div>
      <button onclick="countStream('${key}')" style="margin-top:10px;width:100%;padding:10px;border-radius:20px;border:none;background:#7c3aed;color:#fff">✅ I Streamed This</button>
    `;
    container.appendChild(div);
  });
});

function countStream(key){
  db.ref("missions/"+key+"/totalStreams").transaction(c => (c||0)+1);
}
</script>
</body>
</html>
