<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Missions - borahae.fm</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Manrope',sans-serif;background:#fdf8ff}</style>
</head><body>
<!-- HEADER WITH MENU BUTTON - HOME JAISE -->
<header class="sticky top-0 z-20 bg-[#fdf8ff] border-b px-4 py-3 flex items-center justify-between">
  <div class="flex items-center gap-3"><div class="w-9 h-9 bg-[#7c3aed] rounded-xl flex items-center justify-center text-white font-bold">b</div><span class="font-bold">borahae.fm</span></div>
  <button onclick="toggleMenu()" class="w-9 h-9 bg-white border rounded-full flex items-center justify-center text-[18px]">☰</button>
</header>

<!-- SIDEBAR - EXACT SAME AS YOUR SCREENSHOT -->
<div id="overlay" onclick="toggleMenu()" class="fixed inset-0 bg-black/30 z-30 hidden"></div>
<div id="sideMenu" class="fixed top-0 right-0 w-[78%] max-w-[320px] h-full bg-white z-40 shadow-2xl translate-x-full transition-transform duration-300 flex flex-col">
  <div class="p-6 flex-1">
    <div class="flex justify-between items-center mb-8"><h2 class="text-[22px] font-bold">Menu</h2><button onclick="toggleMenu()" class="text-[22px]">×</button></div>
    <nav class="space-y-1">
      <a href="index.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-50"><span>🏠</span><span class="font-medium">Home</span></a>
      <a href="missions.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-[#f5f0ff] text-[#7c3aed]"><span>🎯</span><span class="font-bold">Missions</span></a>
      <a href="videos.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-50"><span>📺</span><span class="font-medium">Videos</span></a>
      <a href="history.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-50"><span>🕒</span><span class="font-medium">My History</span></a>
      <a href="faq.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-50"><span>💬</span><span class="font-medium">FAQ</span></a>
      <a href="settings.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-50"><span>⚙️</span><span class="font-medium">Settings</span></a>
    </nav>
  </div>
  <div class="p-6 text-center"><p class="text-[13px] text-gray-400">Borahae.fm 💜</p><p class="text-[13px] text-gray-400">Made for ARMY</p></div>
</div>

<main class="max-w-[480px] mx-auto p-5 pb-24">
<p class="text-[11px] tracking-[2px] text-[#7c3aed] font-bold">STARTER MISSIONS / BANGTANTV</p>
<h1 class="text-[34px] font-bold leading-[1.1] mt-2" style="font-family:'Playfair Display'">A little mission for today.</h1>
<div id="list" class="mt-8 space-y-4"><p class="text-center text-gray-400 text-[13px] mt-10">Loading missions... 💜</p></div>
</main>

<script>
function toggleMenu(){
  const m=document.getElementById('sideMenu'), o=document.getElementById('overlay');
  if(m.classList.contains('translate-x-full')){m.classList.remove('translate-x-full');o.classList.remove('hidden');}
  else{m.classList.add('translate-x-full');o.classList.add('hidden');}
}

const firebaseConfig = {
  apiKey: "AIzaSyAdEoRnBLg4N7TEDE1WRU6FBjcrS6r7XNw",
  authDomain: "borahae-fm-f7075.firebaseapp.com",
  databaseURL: "https://borahae-fm-f7075-default-rtdb.firebaseio.com",
  projectId: "borahae-fm-f7075",
  storageBucket: "borahae-fm-f7075.firebasestorage.app",
  messagingSenderId: "319118277965",
  appId: "1:319118277965:web:eece2a5bf15708aab3cb04"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

db.ref('missions').on('value', (snap)=>{
  let data = snap.val();
  if(!data){
    document.getElementById('list').innerHTML = `<p class="text-center text-gray-400 text-[13px] mt-10">No missions yet, owner will add soon 💜</p>`;
    return;
  }
  let html='';
  Object.values(data).reverse().forEach(m=>{
    const videoId = m.id || m.videoId || "";
    const title = m.title || "Untitled";
    const goal = m.requiredStreams || m.goal || 12;
    const desc = m.desc || `Stream ${title} ${goal} times today`;
    if(!videoId) return;
    html+=`<div class="bg-white border rounded-[20px] p-4 flex gap-4 items-center shadow-sm">
    <img src="https://img.youtube.com/vi/${videoId}/mqdefault.jpg" class="w-[70px] h-[70px] rounded-[16px] object-cover">
    <div class="flex-1"><p class="font-bold text-[14px]">${title}</p><p class="text-[12px] text-gray-500">${desc}</p><div class="w-full h-1 bg-gray-100 rounded-full mt-2"><div class="h-1 bg-[#7c3aed] rounded-full" style="width:0%"></div></div><p class="text-[11px] text-gray-400 mt-1">0 / ${goal} streams</p></div><div class="text-[#7c3aed] font-bold text-[13px]">0%</div></div>`;
  });
  document.getElementById('list').innerHTML=html;
});
</script></body></html>
