<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notice - borahae.fm</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>body{font-family:'Manrope',sans-serif;background:#fdf8ff}.font-display{font-family:'Playfair Display',serif}.sidebar-bg{background:#28164f}</style>
</head>
<body>
<!-- Yaha upar wala updated sidebar + header paste karna (same as home) -->
<header class="sticky top-0 z-30 bg-[#fdf8ff]/80 backdrop-blur-md border-b border-[#f3e8ff] px-4 py-3 flex items-center gap-3"><button onclick="openSidebar()" class="w-9 h-9 bg-white border rounded-[10px]">☰</button><div class="w-[38px] h-[38px] bg-[#7c3aed] rounded-[14px] flex items-center justify-center text-white font-display text-[24px] font-bold">b</div><span class="font-bold">Notice</span></header>

<main class="max-w-[600px] mx-auto px-5 pt-6 pb-20">
<h1 class="font-display text-[32px] font-bold">Notice Board</h1><p class="text-[#6b7280] text-[13px] mt-1">Important votings & announcements for ARMYs</p>
<div id="noticeList" class="mt-6 space-y-4"></div>
</main>

<script>
fetch('notices.json').then(r=>r.json()).then(data=>{
  document.getElementById('noticeList').innerHTML = data.map(n=>`
    <div class="bg-white border border-[#f3e8ff] rounded-[20px] p-5">
      <div class="flex justify-between items-center"><span class="text-[10px] tracking-[1.5px] bg-[#f3e8ff] text-[#7c3aed] px-2.5 py-1 rounded-full font-bold">${n.badge}</span><span class="text-[11px] text-[#9ca3af]">${n.date}</span></div>
      <h3 class="font-bold text-[16px] mt-3">${n.title}</h3>
      <p class="text-[13px] text-[#6b7280] mt-1">${n.desc}</p>
      ${n.link? `<a onclick="window.open('${n.link}','_blank')" class="mt-4 inline-block bg-[#7c3aed] text-white px-5 py-2 rounded-full text-[12px] font-bold">Open Link ↗</a>` : ''}
    </div>`).join('');
});
function openSidebar(){document.getElementById('sidebar').classList.remove('-translate-x-full');document.getElementById('sidebarOverlay').classList.remove('hidden');}
function closeSidebar(){document.getElementById('sidebar').classList.add('-translate-x-full');document.getElementById('sidebarOverlay').classList.add('hidden');}
</script>
</body>
</html>
