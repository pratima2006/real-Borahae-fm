<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notice - borahae.fm</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
body{font-family:'Manrope',sans-serif;background:#fdf8ff;transition:0.3s}
.font-display{font-family:'Playfair Display',serif}
.sidebar-bg{background:#28164f}
.tab-active{background:#e5e7eb!important;color:black!important;font-weight:700}
.sub-active{background:rgba(124,58,237,0.15)!important;backdrop-filter:blur(4px);border:1px solid #c4b5fd!important;color:black!important}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #f3e8ff;display:none;justify-content:space-around;padding:8px 0 18px 0;z-index:30;max-width:600px;margin:0 auto;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;opacity:0.5}
.nav-item.active{opacity:1}
body.dark{background:#0f0a1e!important;color:white}
body.dark header{background:#0f0a1e!important}
body.dark.bg-white{background:#1e1440!important;color:white!important;border-color:#2a1f5a!important}
.switch{position:relative;display:inline-block;width:54px;height:30px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#d1d5db;transition:.3s;border-radius:999px}.slider:before{position:absolute;content:"";height:22px;width:22px;left:4px;bottom:4px;background:white;transition:.3s;border-radius:50%}input:checked+.slider{background:#22c55e}input:checked+.slider:before{transform:translateX(24px)}
</style>
</head>
<body>

<header class="sticky top-0 z-30 bg-[#fdf8ff]/80 backdrop-blur-md border-b border-[#f3e8ff] px-4 py-3 flex items-center gap-3">
  <button onclick="openSidebar()" class="w-9 h-9 bg-white border rounded-[10px] flex items-center justify-center">☰</button>
  <div class="w-[38px] h-[38px] bg-[#7c3aed] rounded-[14px] flex items-center justify-center text-white font-display text-[24px] font-bold">b</div>
  <span class="font-bold">borahae.fm</span>
</header>

<div id="sidebarOverlay" onclick="closeSidebar()" class="fixed inset-0 bg-black/50 hidden z-40"></div>
<aside id="sidebar" class="fixed top-0 left-0 w-[75%] max-w-[280px] h-full sidebar-bg z-50 -translate-x-full transition-transform duration-300 flex flex-col p-5">
  <div class="flex justify-between items-center"><div class="flex items-center gap-2"><div class="w-8 h-8 bg-[#7c3aed] rounded-xl flex items-center justify-center text-white font-bold">b</div><span class="text-white font-bold">borahae.fm</span></div><button onclick="closeSidebar()" class="text-white text-xl">✕</button></div>
  <div class="mt-6 flex items-center gap-3 bg-white/10 rounded-[16px] p-3"><img id="sidePfp" src="https://via.placeholder.com/40" class="w-10 h-10 rounded-full object-cover"><div class="overflow-hidden"><p id="sideName" class="text-white text-[13px] font-bold truncate">ARMY</p><p id="sideEmail" class="text-white/60 text-[11px] truncate">...</p></div></div>
  <nav class="mt-6 space-y-1"><a href="home.html" class="flex gap-3 px-4 py-3 rounded-full text-white/60">⌂ Home</a><a href="missions.html" class="flex gap-3 px-4 py-3 rounded-full text-white/60">✦ Missions</a><a href="music.html" class="flex gap-3 px-4 py-3 rounded-full text-white/60">▶ Videos</a><a href="history.html" class="flex gap-3 px-4 py-3 rounded-full text-white/60">◫ History</a><a href="notice.html" class="flex gap-3 px-4 py-3 rounded-full bg-white/10 text-white">🔔 Notice</a><a href="faq.html" class="flex gap-3 px-4 py-3 rounded-full text-white/60">? FAQ</a></nav>
  <div class="mt-auto pt-6 border-t border-white/10"><a href="settings.html" class="flex gap-3 px-4 py-3 rounded-full text-white/40">⚙ Settings</a></div>
</aside>

<main class="max-w-[600px] mx-auto px-5 pt-6 pb-28">
  <h1 class="font-display text-[32px] font-bold">Notice Board</h1>
  <p class="text-[#6b7280] text-[13px] mt-1">Important votings & announcements</p>

  <!-- MAIN 3 TABS -->
  <div class="flex gap-2 mt-5">
    <button id="tabNotice" onclick="switchMainTab('notice')" class="tab-active px-5 py-2 rounded-full text-[13px] bg-white border">Notice</button>
    <button id="tabVotings" onclick="switchMainTab('votings')" class="px-5 py-2 rounded-full text-[13px] bg-white border">Votings</button>
    <button id="tabDonate" onclick="switchMainTab('donate')" class="px-5 py-2 rounded-full text-[13px] bg-white border">Donate</button>
  </div>

  <!-- NOTICE CONTENT -->
  <div id="noticeContent" class="mt-5 space-y-3"></div>

  <!-- VOTINGS CONTENT -->
  <div id="votingsContent" class="mt-5 hidden">
    <div id="ownerAddBox" class="hidden bg-white border border-dashed rounded-[16px] p-4 mb-4"><p class="text-[12px] font-bold">Owner: Add Voting</p><input id="vTitle" placeholder="Title" class="w-full mt-2 border rounded-full px-3 py-2 text-[12px]"><input id="vLink" placeholder="Vote link" class="w-full mt-2 border rounded-full px-3 py-2 text-[12px]"><input id="vEnd" type="date" class="w-full mt-2 border rounded-full px-3 py-2 text-[12px]"><button onclick="addVoting()" class="mt-2 w-full bg-[#7c3aed] text-white py-2 rounded-full text-[12px] font-bold">Add</button></div>
    <div id="votingsList" class="space-y-3"></div>
  </div>

  <!-- DONATE CONTENT -->
  <div id="donateContent" class="mt-5 hidden">
    <div class="flex gap-2"><button id="subBorahae" onclick="switchDonate('borahae')" class="sub-active px-4 py-2 rounded-full text-[12px] bg-white border">Borahae FM Donate</button><button id="subDonate" onclick="switchDonate('donate')" class="px-4 py-2 rounded-full text-[12px] bg-white border">Donate</button></div>
    <div id="borahaeDonateList" class="mt-4 space-y-3"></div>
    <div id="donateLinks" class="mt-4 hidden space-y-3"></div>
  </div>

</main>

<div id="bottomNav" class="bottom-nav">
  <a href="home.html" class="nav-item"><span style="font-size:22px">⌂</span><span style="font-size:10px;font-weight:700">Home</span></a>
  <a href="missions.html" class="nav-item"><span style="font-size:22px">✦</span><span style="font-size:10px;font-weight:700">Missions</span></a>
  <a href="music.html" class="nav-item"><span style="font-size:22px">▶</span><span style="font-size:10px;font-weight:700">Videos</span></a>
  <a href="notice.html" class="nav-item active"><span style="font-size:26px;color:#7c3aed">🔔</span><span style="font-size:10px;font-weight:700">Notice</span></a>
  <a href="settings.html" class="nav-item"><span style="font-size:22px">⚙</span><span style="font-size:10px;font-weight:700">Settings</span></a>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyAdEOrnBLg4N7TEDE1WRU6FBjerS6r7Xnw",authDomain:"borahae-fm-f7075.firebaseapp.com",projectId:"borahae-fm-f7075"}; if(!firebase.apps.length) firebase.initializeApp(firebaseConfig); const db=firebase.firestore(); const OWNER_EMAILS=['pratimatribhuvan2006@gmail.com','tribhuvanpratima38@gmail.com']; let isOwner=false;

firebase.auth().onAuthStateChanged(user=>{
  if(user){ document.getElementById('sideEmail').innerText=user.email; document.getElementById('sideName').innerText=user.displayName||'ARMY'; if(user.photoURL) document.getElementById('sidePfp').src=user.photoURL; if(OWNER_EMAILS.includes(user.email.toLowerCase())){ isOwner=true; document.getElementById('ownerAddBox').classList.remove('hidden'); } }
  let mode=localStorage.getItem('borahae_navMode')||'sidebar'; if(mode==='navigation'){ document.getElementById('sidebar').style.display='none'; document.getElementById('bottomNav').style.display='flex'; } else { document.getElementById('bottomNav').style.display='none'; }
  if(localStorage.getItem('borahae_dark')==='true') document.body.classList.add('dark');
});

function openSidebar(){ if(localStorage.getItem('borahae_navMode')==='navigation') return; document.getElementById('sidebar').classList.remove('-translate-x-full'); document.getElementById('sidebarOverlay').classList.remove('hidden'); }
function closeSidebar(){ document.getElementById('sidebar').classList.add('-translate-x-full'); document.getElementById('sidebarOverlay').classList.add('hidden'); }

// TABS
function switchMainTab(tab){
  document.getElementById('tabNotice').classList.remove('tab-active'); document.getElementById('tabVotings').classList.remove('tab-active'); document.getElementById('tabDonate').classList.remove('tab-active');
  document.getElementById('noticeContent').classList.add('hidden'); document.getElementById('votingsContent').classList.add('hidden'); document.getElementById('donateContent').classList.add('hidden');
  if(tab==='notice'){ document.getElementById('tabNotice').classList.add('tab-active'); document.getElementById('noticeContent').classList.remove('hidden'); loadNotices(); }
  if(tab==='votings'){ document.getElementById('tabVotings').classList.add('tab-active'); document.getElementById('votingsContent').classList.remove('hidden'); loadVotings(); }
  if(tab==='donate'){ document.getElementById('tabDonate').classList.add('tab-active'); document.getElementById('donateContent').classList.remove('hidden'); loadDonates(); }
}
function switchDonate(type){
  document.getElementById('subBorahae').classList.remove('sub-active'); document.getElementById('subDonate').classList.remove('sub-active');
  document.getElementById('borahaeDonateList').classList.add('hidden'); document.getElementById('donateLinks').classList.add('hidden');
  if(type==='borahae'){ document.getElementById('subBorahae').classList.add('sub-active'); document.getElementById('borahaeDonateList').classList.remove('hidden'); }
  else { document.getElementById('subDonate').classList.add('sub-active'); document.getElementById('donateLinks').classList.remove('hidden'); }
}

// LOAD NOTICE - FIX 404
async function loadNotices(){
  try{
    let res = await fetch('./notices.json'); if(!res.ok) throw '404';
    let data = await res.json();
    document.getElementById('noticeContent').innerHTML = data.map(n=>`<div class="bg-white border border-[#f3e8ff] rounded-[16px] p-4"><div class="flex justify-between"><span class="text-[9px] tracking-[1px] bg-[#f3e8ff] text-[#7c3aed] px-2 py-1 rounded-full font-bold">${n.badge}</span><span class="text-[10px] text-[#9ca3af]">${n.date}</span></div><h3 class="font-bold text-[13px] mt-2">${n.title}</h3><p class="text-[12px] text-[#6b7280] mt-1">${n.desc}</p>${n.link? `<a href="${n.link}" target="_blank" class="mt-3 inline-block bg-[#7c3aed] text-white px-4 py-1.5 rounded-full text-[11px] font-bold">Open ↗</a>`:''}</div>`).join('');
  }catch(e){ document.getElementById('noticeContent').innerHTML = `<p class="text-[12px] text-gray-400">notices.json not found. GitHub pe file ka naam check kar - notices.json lowercase me hona chahiye same folder me.</p>`; }
}

// VOTINGS - ONLY OWNER CAN ADD/DELETE, AUTO HIDE ENDED
function loadVotings(){
  let votings = JSON.parse(localStorage.getItem('borahae_votings')||'[]');
  let now = new Date();
  votings = votings.filter(v=> new Date(v.endDate) >= now); // ended gayab
  localStorage.setItem('borahae_votings', JSON.stringify(votings));
  document.getElementById('votingsList').innerHTML = votings.length? votings.map((v,i)=>`<div class="bg-white border rounded-[16px] p-4"><div class="flex justify-between"><span class="text-[10px] bg-[#ede9fe] text-[#7c3aed] px-2 py-1 rounded-full font-bold">VOTING</span><span class="text-[10px] text-gray-400">${v.date} • Ends ${v.endDate}</span></div><h3 class="font-bold text-[13px] mt-2">${v.title}</h3><a href="${v.link}" target="_blank" class="mt-3 inline-block bg-black text-white px-4 py-1.5 rounded-full text-[11px] font-bold">Vote Now ↗</a>${isOwner? `<button onclick="deleteVoting(${i})" class="ml-2 text-[11px] text-red-500 font-bold">Delete</button>`:''}</div>`).join('') : '<p class="text-[12px] text-gray-400">No active votings now 💜</p>';
}
function addVoting(){
  if(!isOwner) return alert('Only owner');
  let title=document.getElementById('vTitle').value, link=document.getElementById('vLink').value, endDate=document.getElementById('vEnd').value;
  if(!title||!link||!endDate) return alert('Fill all');
  let votings=JSON.parse(localStorage.getItem('borahae_votings')||'[]');
  votings.unshift({title,link,endDate,date:new Date().toLocaleDateString()});
  localStorage.setItem('borahae_votings', JSON.stringify(votings));
  loadVotings(); document.getElementById('vTitle').value=''; document.getElementById('vLink').value='';
}
function deleteVoting(i){ if(!isOwner) return; let v=JSON.parse(localStorage.getItem('borahae_votings')||'[]'); v.splice(i,1); localStorage.setItem('borahae_votings', JSON.stringify(v)); loadVotings(); }

// DONATE - PERMANENT HISTORY
function loadDonates(){
  // Borahae FM Donate History - kabhi delete nahi hoga, owner bhi nahi kar sakta
  let borahaeDonates = JSON.parse(localStorage.getItem('borahae_fm_donates')||'[{"title":"Donated to UNICEF for BTS Love Myself","amount":"₹500","date":"Aug 2026","proof":""}]');
  document.getElementById('borahaeDonateList').innerHTML = borahaeDonates.map(d=>`<div class="bg-white border border-[#e9d5ff] rounded-[16px] p-4 shadow-[0_0_20px_rgba(124,58,237,0.1)]"><div class="flex justify-between"><span class="text-[9px] bg-[#f3e8ff] text-[#7c3aed] px-2 py-1 rounded-full font-bold">BORAH AE FM</span><span class="text-[10px] text-gray-400">${d.date}</span></div><h3 class="font-bold text-[13px] mt-2 text-black">${d.title}</h3><p class="text-[12px] mt-1 text-black font-bold">${d.amount}</p></div>`).join('');

  // Donate Links - tu yaha edit kar sakti hai
  let donateLinks = [{"title":"Donate for BTS Birthday Ads","desc":"Support street ads & cafe events","link":"https://..."}, {"title":"Palestine Relief","desc":"Donate via trusted org","link":"https://..."}];
  document.getElementById('donateLinks').innerHTML = donateLinks.map(d=>`<div class="bg-white border rounded-[16px] p-4"><h3 class="font-bold text-[13px]">${d.title}</h3><p class="text-[12px] text-[#6b7280] mt-1">${d.desc}</p><a href="${d.link}" target="_blank" class="mt-3 inline-block bg-[#7c3aed] text-white px-4 py-1.5 rounded-full text-[11px] font-bold">Donate ↗</a></div>`).join('');
}

switchMainTab('notice');
</script>
</body></html>
