<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What's New - borahae.fm</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Manrope:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Manrope',sans-serif; background:#fdf8ff; color:#1a1033; transition:0.3s}
.font-display{font-family:'Playfair Display',serif;}.font-mono{font-family:'DM Mono',monospace;}
.paper-grid{background-image:linear-gradient(#e9d5ff1f 1px, transparent 1px),linear-gradient(90deg, #e9d5ff1f 1px, transparent 1px); background-size:22px 22px;}
.sidebar-bg{background:#28164f;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #f3e8ff;display:none;justify-content:space-around;padding:8px 0 18px 0;z-index:30;max-width:600px;margin:0 auto;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;opacity:0.5}
.nav-item.active{opacity:1}
 body.dark{background:#0f0a1e!important;color:white!important}
 body.dark header{background:#0f0a1e!important;border-color:#1f1340!important}
 body.dark.bg-white{background:#1e1440!important;color:white!important;border-color:#2a1f5a!important}
 body.dark.text-[#6b7280]{color:#a1aa!important}
</style>
</head>
<body class="paper-grid">
<header class="sticky top-0 z-30 bg-[#fdf8ff]/80 backdrop-blur-md border-b border-[#f3e8ff] px-4 py-3 flex items-center gap-3">
  <button onclick="openSidebar()" class="w-9 h-9 bg-white border border-[#ede9fe] rounded-[10px] flex items-center justify-center text-[20px]">☰</button>
  <div class="w-[38px] h-[38px] bg-[#7c3aed] rounded-[14px] flex items-center justify-center text-white font-display text-[24px] font-bold">b</div>
  <span class="font-bold text-[15px]">What's New</span>
</header>

<div id="sidebarOverlay" onclick="closeSidebar()" class="fixed inset-0 bg-black/40 hidden z-40"></div>
<aside id="sidebar" class="fixed top-0 left-0 w-[280px] h-full sidebar-bg z-50 -translate-x-full transition-all duration-300 ease-out flex flex-col p-5">
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-3"><div class="w-[34px] h-[34px] bg-[#7c3aed] rounded-[12px] flex items-center justify-center text-white font-display text-[20px]">b</div><span class="text-white font-bold text-[16px]">borahae<span class="text-[#a78bfa]">.fm</span></span></div>
    <button onclick="closeSidebar()" class="text-white/70 text-[20px]">✕</button>
  </div>
  <div class="mt-6 flex items-center gap-3 bg-white/10 rounded-[16px] p-3">
    <img id="sidePfp" src="https://via.placeholder.com/40" class="w-10 h-10 rounded-full object-cover bg-white/20">
    <div class="overflow-hidden"><p id="sideName" class="text-white text-[12px] font-bold truncate">ARMY</p><p id="sideEmail" class="text-white/50 text-[10px] truncate">loading...</p></div>
  </div>
  <p class="font-mono text-[9px] tracking-[2.5px] text-white/40 mt-6 mb-2">YOUR SCRAPBOOK</p>
  <nav class="space-y-[2px]">
    <a href="home.html" class="flex items-center gap-3 px-3 py-2.5 rounded-full text-white/60 text-[13px]">⌂ Home</a>
    <a href="notice.html" class="flex items-center gap-3 px-3 py-2.5 rounded-full text-white/60 text-[13px]">◐ Notice</a>
    <a href="missions.html" class="flex items-center gap-3 px-3 py-2.5 rounded-full text-white/60 text-[13px]">✦ Missions</a>
    <a href="music.html" class="flex items-center gap-3 px-3 py-2.5 rounded-full text-white/60 text-[13px]">▶ Videos</a>
    <a href="history.html" class="flex items-center gap-3 px-3 py-2.5 rounded-full text-white/60 text-[13px]">◫ My History</a>
    <a href="faq.html" class="flex items-center gap-3 px-3 py-2.5 rounded-full text-white/60 text-[13px]">? FAQ</a>
  </nav>
  <div class="mt-auto">
    <div class="border-t border-white/10 pt-4 space-y-[2px]">
      <a href="whatsnew.html" class="flex items-center gap-3 px-3 py-2.5 rounded-full bg-white/10 text-white font-semibold text-[13px]">✧ What's New</a>
      <a href="settings.html" class="flex items-center gap-3 px-3 py-2.5 rounded-full text-white/60 text-[13px]">⚙ Settings</a>
    </div>
  </div>
</aside>

<main class="max-w-[600px] mx-auto px-5 pt-6 pb-28">
  <h1 class="font-display text-[32px] font-bold">What's New</h1>
  <p class="text-[#6b7280] text-[13px] mt-1">New features added to Borahae FM</p>
  <div id="whatsnewList" class="mt-6 relative border-l border-[#e9d5ff] ml-3 pl-6 space-y-6"></div>
</main>

<div id="bottomNav" class="bottom-nav">
  <a href="home.html" class="nav-item"><span style="font-size:22px">⌂</span><span style="font-size:10px;font-weight:700">Home</span></a>
  <a href="notice.html" class="nav-item"><span style="font-size:22px">◐</span><span style="font-size:10px;font-weight:700">Notice</span></a>
  <a href="missions.html" class="nav-item"><span style="font-size:22px">✦</span><span style="font-size:10px;font-weight:700">Missions</span></a>
  <a href="whatsnew.html" class="nav-item active"><span style="font-size:26px;color:#7c3aed">✧</span><span style="font-size:10px;font-weight:700">New</span></a>
  <a href="settings.html" class="nav-item"><span style="font-size:22px">⚙</span><span style="font-size:10px;font-weight:700">Settings</span></a>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyAdEOrnBLg4N7TEDE1WRU6FBjerS6r7Xnw",authDomain:"borahae-fm-f7075.firebaseapp.com",projectId:"borahae-fm-f7075"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);

firebase.auth().onAuthStateChanged(user=>{
  if(user){
    document.getElementById('sideEmail').innerText=user.email;
    document.getElementById('sideName').innerText=user.displayName||localStorage.getItem('army_name')||'ARMY';
    if(user.photoURL) document.getElementById('sidePfp').src=user.photoURL;
  }
  let mode=localStorage.getItem('borahae_navMode')||'sidebar';
  if(mode==='navigation'){ document.getElementById('sidebar').style.display='none'; document.getElementById('bottomNav').style.display='flex'; }
  else { document.getElementById('bottomNav').style.display='none'; document.getElementById('sidebar').style.display='flex'; }
  if(localStorage.getItem('borahae_dark')==='true') document.body.classList.add('dark');
});

function openSidebar(){ if(localStorage.getItem('borahae_navMode')==='navigation') return; document.getElementById('sidebar').classList.remove('-translate-x-full'); document.getElementById('sidebarOverlay').classList.remove('hidden'); }
function closeSidebar(){ document.getElementById('sidebar').classList.add('-translate-x-full'); document.getElementById('sidebarOverlay').classList.add('hidden'); }

async function loadWhatsNew(){
  try{
    let res = await fetch('./whatsnew.json');
    if(!res.ok) throw new Error('404');
    let data = await res.json();
    document.getElementById('whatsnewList').innerHTML = data.map(n=>`
      <div class="relative">
        <div class="absolute -left-[31px] top-1 w-3 h-3 bg-[#7c3aed] rounded-full border-2 border-white"></div>
        <div class="bg-white border border-[#f3e8ff] rounded-[18px] p-4 shadow-sm">
          <div class="flex gap-2 items-center"><span class="text-[10px] bg-[#28164f] text-white px-2 py-0.5 rounded-full font-bold">${n.version}</span><span class="text-[11px] text-[#9ca3af]">${n.date}</span></div>
          <h3 class="font-bold text-[14px] mt-2">${n.title}</h3>
          <p class="text-[12px] text-[#6b7280] mt-1 leading-[1.4]">${n.desc}</p>
        </div>
      </div>`).join('');
  }catch(e){
    console.log(e);
    document.getElementById('whatsnewList').innerHTML = `<div class="bg-white border border-red-200 rounded-[16px] p-4"><p class="text-[12px] text-red-500 font-bold">whatsnew.json not found (404)</p><p class="text-[11px] text-gray-500 mt-1">GitHub me file naam check kar: <b>whatsnew.json</b> small me hona chahiye, same folder me jisme ye html hai. Agar Vercel pe hai to redeploy kar.</p><p class="text-[11px] text-gray-400 mt-2">Fallback demo data dikha rahi hu:</p><div class="mt-3 border-l border-[#e9d5ff] pl-4"><p class="text-[13px] font-bold">v2.1 - Memoir Added</p></div></div>`;
  }
}
loadWhatsNew();
</script>
</body>
</html>
